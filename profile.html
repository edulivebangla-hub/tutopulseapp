    <style>
        * {

        body {

            --text:#000;
        }
        body.dark {
            background-color: #0f172a;

        /* --- Header Styles --- */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #0555E8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        /* --- Main Content Area --- */
        .app-content {
            position: fixed;
            top: 50px;
            bottom: 65px;
            width: 100%;
            overflow-y: auto;
            background-color: #ffffff;
        }
        body.dark .app-content {
            background-color: #000;
        }

        /* Custom Toggle Switch Style */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #b0bec5;
            transition: .25s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .25s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #49599a;
        }
        body.dark input:checked + .slider {
            background-color: #6366f1;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Modals & Popups styling */
        #profileModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 60;
            align-items: flex-end;
        }
        #profileModal.active { display: flex; }
        .modal-content {
            background: white;
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            animation: slideUp 0.3s ease-out;
            max-height: 85vh;
            overflow-y: auto;
        }
        body.dark .modal-content {
            background: #1e293b;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .crop-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .crop-card {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        body.dark .crop-card {
            background: #1e293b;
        }

        .clickable-row:active {
            transform: scale(0.99);
        }

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();

        // ===== UNIFIED LOCALSTORAGE HELPERS =====
        function getStoredUserData() {
            const primary = JSON.parse(localStorage.getItem('tgUser')) || {};
            const secondary = JSON.parse(localStorage.getItem('tgUser2')) || {};
            
            // Legacy fallbacks
            const legacyName = localStorage.getItem('student_display_name');
            const legacyEmail = localStorage.getItem('profile_vault_email');
            const legacyAvatar = localStorage.getItem('profile_image_url');

            return {
                name: primary.name || secondary.name || legacyName || "Update Profile",
                email: primary.email || secondary.email || legacyEmail || "sample@gmail.com",
                pic: primary.pic || secondary.pic || legacyAvatar || "https://i.ibb.co/4pDNDk1/avatar.png",
                mobile: primary.mobile || secondary.mobile || "",
                class: primary.class || secondary.class || "",
                completed: primary.completed || secondary.completed || false
            };
        }

        function saveUserData(data) {
            const current = getStoredUserData();
            const updated = { ...current, ...data };
            
            // Sync to all profile storage keys
            localStorage.setItem('tgUser', JSON.stringify(updated));
            localStorage.setItem('tgUser2', JSON.stringify(updated));
            
            // Legacy Keys sync
            localStorage.setItem('student_display_name', updated.name);
            localStorage.setItem('profile_vault_email', updated.email);
            localStorage.setItem('profile_image_url', updated.pic);

            return updated;
        }

        let currentCropper = null;
        const mainAvatar = document.getElementById('profilePic');
        const modalAvatarPreview = document.getElementById('modalAvatarPreview');
        const usernameSpan = document.getElementById('username');
        const userEmailSpan = document.getElementById('userEmail');
        const userClassBadge = document.getElementById('userClassBadge');
        
        const editNameInput = document.getElementById('editNameInput');
        const editEmailInput = document.getElementById('editEmailInput');
        const editMobileInput = document.getElementById('editMobileInput');
        const editClassInput = document.getElementById('editClassInput');
        
        const fileInput = document.getElementById('hiddenFileInput');
        const darkToggleBtn = document.getElementById('darkToggleBtn');

        // Initial Data Load
        window.addEventListener('DOMContentLoaded', () => {
            loadUserProfileData();

            // Dark Mode setup
            const isDarkMode = localStorage.getItem('darkMode') === "true";
            darkToggleBtn.checked = isDarkMode;
            toggleDarkModeClass(isDarkMode);
        });

        function loadUserProfileData() {
            const data = getStoredUserData();
            
            usernameSpan.textContent = data.name;
            userEmailSpan.textContent = data.email;
            userClassBadge.textContent = data.class;
            
            mainAvatar.src = data.pic;
            modalAvatarPreview.src = data.pic;
        }

        // Dark Mode Logic
        darkToggleBtn.addEventListener('change', function() {
            const isDark = this.checked;
            localStorage.setItem("darkMode", isDark ? "true" : "false");
            toggleDarkModeClass(isDark);
        });

        function toggleDarkModeClass(isDark) {
            if (isDark) {
                document.body.classList.add('dark');
                document.documentElement.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
                document.documentElement.classList.remove('dark');
            }
        }

        // Modal Handling
        function openProfileModal() {
            const data = getStoredUserData();
            editNameInput.value = data.name;
            editEmailInput.value = data.email;
            editMobileInput.value = data.mobile;
            editClassInput.value = data.class;
            
            document.getElementById('profileModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        function closeModalOnBg(e) {
            if(e.target.id === 'profileModal') closeModal();
        }

        function saveUpdatedProfile() {
            saveUserData({
                name: editNameInput.value.trim(),
                email: editEmailInput.value.trim(),
                mobile: editMobileInput.value.trim(),
                class: editClassInput.value,
                pic: modalAvatarPreview.src,
                completed: true
            });
            
            loadUserProfileData();
            closeModal();
        }

        function triggerUploadFromModal() {
            fileInput.click();
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('cropModalWindow').style.display = 'flex';
                    const cropImg = document.getElementById('cropImageElement');
                    cropImg.src = event.target.result;
                    
                    if (currentCropper) currentCropper.destroy();
                    
                    setTimeout(() => {
                        currentCropper = new Cropper(cropImg, {
                            aspectRatio: 1,
                            viewMode: 1,
                            background: false
                        });
                    }, 50);
                };
                reader.readAsDataURL(file);
            }
        });

        function closeCropModal() {
            document.getElementById('cropModalWindow').style.display = 'none';
            fileInput.value = '';
        }

        function confirmCrop() {
            if (!currentCropper) return;
            const canvas = currentCropper.getCroppedCanvas({
                width: 180,
                height: 180
            });
            
            const croppedDataUrl = canvas.toDataURL('image/jpeg');
            mainAvatar.src = croppedDataUrl;
            modalAvatarPreview.src = croppedDataUrl;
            
            saveUserData({ pic: croppedDataUrl });
            closeCropModal();
        }
    </script>
