<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TutoPulse - Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', sans-serif;
        }

        a, span, p, h1, h2, h3, h4, h5, h6, div {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
            text-decoration: none;
        }

        img {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
        }

        /* LIGHT MODE VARIABLES */
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --header-bg: #3047a5;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #f1f5f9;
            --border-dark: #e2e8f0;
            --input-bg: rgba(255,255,0.95);
            --search-results-bg: #ffffff;
            --result-hover: #f8fafc;
            --result-active: #f1f5f9;
            --clear-btn-bg: #e2e8f0;
            --clear-btn-color: #475569;
            --highlight-bg: linear-gradient(135deg, #fbbf24, #f59e0b);
            --highlight-text: #1e293b;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }

        /* DARK MODE VARIABLES */
        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --header-bg: #1e293b;
            --text-dark: #f1f5f9;
            --text-light: #cbd5e1;
            --text-muted: #64748b;
            --border: #334155;
            --border-dark: #475569;
            --input-bg: rgba(30,41,59,0.95);
            --search-results-bg: #1e293b;
            --result-hover: #334155;
            --result-active: #475569;
            --clear-btn-bg: #334155;
            --clear-btn-color: #cbd5e1;
            --highlight-bg: linear-gradient(135deg, #fbbf24, #f59e0b);
            --highlight-text: #0f172a;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
        }

        body {
            background: var(--bg);
            overflow-x: hidden;
        }

        /* --- Header Styles --- */
      .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            padding: 0 12px;
            z-index: 1000;
            box-shadow: var(--shadow);
            gap: 12px;
        }

      .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            flex-shrink: 0;
        }

      .back-btn:active {
            background: rgba(255,255,0.15);
            transform: scale(0.95);
        }

      .search-container {
            flex: 1;
            position: relative;
            max-width: 500px;
        }

      .search-input {
            width: 100%;
            height: 40px;
            border-radius: 50px;
            border: none;
            padding: 0 45px 0 18px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            background: var(--bg);
            color: var(--text-dark);
            transition: all 0.3s;
        }

      .search-input:focus {
            background: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(255,255,0.3);
        }

      .search-input::placeholder {
            color: var(--text-light);
            font-weight: 500;
        }

      .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }

      .clear-btn {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--clear-btn-bg);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--clear-btn-color);
        }

      .clear-btn.show {
            display: flex;
        }

      .dark-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            flex-shrink: 0;
            background: rgba(255,255,0.15);
            border: none;
            font-size: 18px;
        }

      .dark-toggle:active {
            background: rgba(255,255,0.25);
            transform: scale(0.95);
        }

        /* MAIN CONTENT */
      .app-content {
            margin-top: 60px;
            padding: 20px 16px;
            min-height: calc(100vh - 60px);
        }

        /* SEARCH RESULTS DROPDOWN */
      .search-results {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            background: var(--search-results-bg);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            box-shadow: var(--shadow-lg);
            z-index: 999;
        }

      .search-results.show {
            max-height: 400px;
            overflow-y: auto;
        }

      .result-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.2s;
            gap: 12px;
        }

      .result-item:hover {
            background: var(--result-hover);
        }

      .result-item:active {
            background: var(--result-active);
        }

      .result-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

      .result-text {
            flex: 1;
        }

      .result-title {
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 2px;
            color: var(--text-dark);
        }

      .result-desc {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 600;
        }

      .no-results {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-light);
        }

      .no-results-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            background: var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

      .no-results-title {
            font-weight: 800;
            font-size: 18px;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

      .no-results-text {
            font-size: 14px;
            color: var(--text-light);
        }

        /* DEMO CONTENT */
      .demo-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }

      .demo-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

      .demo-text {
            color: var(--text-light);
            line-height: 1.6;
            font-size: 15px;
        }

      .highlight {
            background: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <!-- HEADER WITH BACK + SEARCH + DARK TOGGLE -->
    <header class="app-header">
        <div class="back-btn" onclick="goBack()">
            <i data-lucide="arrow-left" width="22" height="22"></i>
        </div>
        
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search courses, topics..."
                autocomplete="on"
                autofocus
                enterkeyhint="search"
            >
            <div class="clear-btn" id="clearBtn" onclick="clearSearch()">
                <i data-lucide="x" width="12" height="12"></i>
            </div>
            <i data-lucide="search" width="18" height="18" class="search-icon"></i>
        </div>

        <button style="display: none;" class="dark-toggle" id="darkToggle">🌙</button>
    </header>

    <!-- SEARCH RESULTS DROPDOWN -->
    <div class="search-results" id="searchResults"></div>

 

    <script>
        lucide.createIcons();

        // Sample searchable data - replace with your actual data
        const searchData = [
            {
                id: 1,
                title: "Class 12 3rd Semester [বাংলা + English] উচ্চমাধ্যমিক তৃতীয় সেমিস্টার",
                desc: "Advanced Course & Technology",
                url: "hs/hs.html?id=course1,course3",
                icon: "search",
                keywords: ["class12","hs", "3rd semester", "বাংলা + english", "উচ্চমাধ্যমিক তৃতীয় সেমিস্টার", "class 12"]
            },
            {
                id: 2,
                title: "Class 11 1st Semester [বাংলা + English] একাদশ প্রথম সেমিস্টার",
                desc: "Full syllabus practice papers",
                url: "hs/hs.html?id=course2",
                icon: "search",
                keywords: ["class11","hs", "1st semester", "বাংলা + english", "একাদশ প্রথম সেমিস্টার", "class 11"]
            },
        ];

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const clearBtn = document.getElementById('clearBtn');
        const darkToggle = document.getElementById('darkToggle');

        // DARK MODE TOGGLE
        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark");
            darkToggle.textContent = "☀️";
        }

        darkToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const isDark = document.body.classList.contains("dark");
            localStorage.setItem("darkMode", isDark);
            darkToggle.textContent = isDark ? "☀️" : "🌙";
        });

        // AUTO FOCUS ON LOAD - Makes keyboard appear
        window.addEventListener('load', function() {
            setTimeout(() => {
                searchInput.focus();
                searchInput.click();
            }, 100);
        });

        // Also focus when page becomes visible
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                setTimeout(() => searchInput.focus(), 100);
            }
        });

        function goBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'home.html';
            }
        }

        function clearSearch() {
            searchInput.value = '';
            searchResults.classList.remove('show');
            clearBtn.classList.remove('show');
            searchInput.focus();
        }

        // Live search function
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            
            if (query.length === 0) {
                searchResults.classList.remove('show');
                clearBtn.classList.remove('show');
                return;
            }

            clearBtn.classList.add('show');

            if (query.length < 2) {
                searchResults.classList.remove('show');
                return;
            }

            const results = searchData.filter(item => {
                const searchText = item.title.toLowerCase() + ' ' + item.desc.toLowerCase() + ' ' + item.keywords.join(' ');
                return searchText.includes(query);
            });

            displayResults(results, query);
        });

        function displayResults(results, query) {
            searchResults.innerHTML = '';
            
            if (results.length === 0) {
                searchResults.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">
                            <i data-lucide="search-x" width="28" height="28"></i>
                        </div>
                        <div class="no-results-title">Not found</div>
                        <div class="no-results-text">No results for "${query}"</div>
                    </div>
                `;
            } else {
                results.forEach(item => {
                    const resultHTML = `
                        <a href="${item.url}" class="result-item">
                            <div class="result-icon">
                                <i data-lucide="${item.icon}" width="20" height="20"></i>
                            </div>
                            <div class="result-text">
                                <div class="result-title">${highlightMatch(item.title, query)}</div>
                                <div class="result-desc">${item.desc}</div>
                            </div>
                            <i data-lucide="chevron-right" width="18" height="18" style="color: var(--text-muted);"></i>
                        </a>
                    `;
                    searchResults.innerHTML += resultHTML;
                });
            }

            searchResults.classList.add('show');
            lucide.createIcons();
        }

        function highlightMatch(text, query) {
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.app-header') && !e.target.closest('.search-results')) {
                searchResults.classList.remove('show');
            }
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const firstResult = searchResults.querySelector('.result-item');
                if (firstResult) {
                    window.location.href = firstResult.href;
                }
            }
        });

        searchInput.addEventListener('focus', function() {
            if (this.value.trim().length >= 2) {
                searchResults.classList.add('show');
            }
        });
    </script>
</body>
</html>
