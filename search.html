<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Search Course</title>
<script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
              }

        :root {
            --bg-color: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #f3f4f6;
            --primary-blue: #3b82f6;
            --light-blue-bg: #eff6ff;
            --light-orange-bg: #fff7ed;
            --light-red-bg: #fef2f2;
            --chip-bg: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body.dark {
            --bg-color: #0f172a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1e293b;
            --light-blue-bg: #1e293b;
            --light-orange-bg: #1e293b;
            --light-red-bg: #1e293b;
            --chip-bg: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #0555E8;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: var(--border-color);
        }

        .search-container {
            flex: 1; background: #fff; padding: 6px; border-radius: 10px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .search-input { padding-left: 8px;
            width: 100%;
            border: none;
            outline: none;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            background: transparent;
            padding-right: 30px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .clear-input-btn {
            position: absolute;
            right: 0; padding-right: 8px;
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: none;
        }

        .clear-input-btn.show {
            display: flex;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            margin-top: 50px;
            padding: 20px 20px 90px;
            flex: 1;
        }

        /* RECENT SEARCHES */
        .recent-section {
            margin-top: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            cursor: pointer;
        }

        .recent-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .recent-icon {
            color: var(--text-muted);
        }

        .recent-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        /* SEARCH RESULTS */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-card {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s ease;
        }

        .result-card:active {
            transform: scale(0.98);
        }

        .result-thumb {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

        .result-info {
            flex: 1;
        }

        .result-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .result-desc {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .highlight {
            color: #2563eb;
            font-weight: 800;
        }

        /* EMPTY STATES */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-illustration {
            width: 180px;
            height: 180px;
            margin-bottom: 24px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: #64748b;
        }

        /* FLOATING FOOTER BUTTON */
        .floating-footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 90;
        }

        .help-chip {
            pointer-events: auto;
            background: var(--chip-bg);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: #3b82f6;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .help-chip:active {
            transform: scale(0.95);
        }

        /* BOTTOM SHEET MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            border-radius: 24px 24px 0 0;
            padding: 12px 20px 30px;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .modal-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-drag-handle {
            width: 36px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .sheet-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .guide-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .guide-card {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
        }

        .guide-card.blue {
            background-color: var(--light-blue-bg);
        }

        .guide-card.orange {
            background-color: var(--light-orange-bg);
        }

        .guide-card.red {
            background-color: var(--light-red-bg);
            align-items: center;
        }

        .guide-icon {
            margin-top: 2px;
        }

        .guide-card.blue .guide-icon { color: #3b82f6; }
        .guide-card.orange .guide-icon { color: #f59e0b; }
        .guide-card.red .guide-icon-bg {
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 8px;
            display: flex;
        }

        .guide-text {
            flex: 1;
        }

        .guide-head {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .guide-sub {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- TOP SEARCH HEADER -->
    <header class="app-header">
        <button class="icon-btn" onclick="goBack()">
            <i data-lucide="chevron-left" width="26" height="26"></i>
        </button>
        
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search Course"
                autocomplete="off"
                autofocus
            >
            <button class="clear-input-btn" id="clearBtn" onclick="clearSearch()">
                <i data-lucide="x" width="20" height="20"></i>
            </button>
        </div>
    </header>

    <!-- MAIN DYNAMIC CONTENT -->
    <main class="main-content" id="mainContent">
        <!-- Content gets generated via JavaScript -->
    </main>

    <!-- FLOATING HELP FOOTER BUTTON -->
    <div class="floating-footer">
        <button class="help-chip" onclick="openModal()">
            <i data-lucide="help-circle" width="18" height="18"></i>
            <span>How to Search? (কীভাবে খুঁজবেন?)</span>
        </button>
    </div>

    <!-- HOW TO SEARCH MODAL / BOTTOM SHEET -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-drag-handle"></div>
            <div class="sheet-title">How to Search? (কীভাবে খুঁজবেন?)</div>
            
            <div class="guide-cards">
                <!-- Search by Name -->
                <div class="guide-card blue">
                    <i data-lucide="text-select" width="22" height="22" class="guide-icon"></i>
                    <div class="guide-text">
                        <div class="guide-head">Search by Name (নাম দিয়ে খুঁজুন)</div>
                        <div class="guide-sub">Type Course name or Subject. কোর্সের নাম বা বিষয় লিখে সার্চ করুন।</div>
                    </div>
                </div>

                <!-- Detailed Search -->
                <div class="guide-card orange">
                    <i data-lucide="file-search" width="22" height="22" class="guide-icon"></i>
                    <div class="guide-text">
                        <div class="guide-head">Detailed Search (বিস্তারিত সার্চ)</div>
                        <div class="guide-sub">You can search by Class or Topic. টপিক লিখেও খুঁজতে পারেন।</div>
                    </div>
                </div>

                <!-- Video Tutorial Button -->
                <a href="#" class="guide-card red" onclick="playTutorial()">
                    <div class="guide-icon-bg">
                        <i data-lucide="play" width="18" height="18" fill="currentColor"></i>
                    </div>
                    <div class="guide-text">
                        <div class="guide-head">Watch Video Tutorial</div>
                        <div class="guide-sub">ভিডিও দেখে নিন</div>
                    </div>
                    <i data-lucide="chevron-right" width="20" height="20" style="color: #94a3b8;"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Sample Search Data
        const searchData = [
            {
                id: 1,
                title: "Class 12 3rd Semester [বাংলা + English] উচ্চমাধ্যমিক তৃতীয় সেমিস্টার",
                desc: "Advanced Course & Technology",
                url: "hs/hs.html?id=course1",
                keywords: ["class12", "hs", "3rd semester", "বাংলা", "english", "উচ্চমাধ্যমিক", "তৃতীয় সেমিস্টার"]
            },
            {
                id: 2,
                title: "Class 11 1st Semester [বাংলা + English] একাদশ প্রথম সেমিস্টার",
                desc: "Full syllabus practice papers",
                url: "hs/hs.html?id=course2",
                keywords: ["class11", "hs", "1st semester", "বাংলা", "english", "একাদশ", "প্রথম সেমিস্টার"]
            }
        ];

        // State & DOM Elements
        let recentSearches = JSON.parse(localStorage.getItem('recentSearches')) || ['hsjjk'];
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const mainContent = document.getElementById('mainContent');
        const modalOverlay = document.getElementById('modalOverlay');

        // SVG Empty State Illustration
        const emptyDocSVG = `
            <svg class="empty-illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 40H120L150 70V160C150 165.523 145.523 170 140 170H60C54.4772 170 50 165.523 50 160V50C50 44.4772 54.4772 40 60 40Z" fill="#EEF2FF" stroke="#6366F1" stroke-width="4" stroke-linejoin="round"/>
                <path d="M120 40V70H150" stroke="#6366F1" stroke-width="4" stroke-linejoin="round"/>
                <line x1="70" y1="100" x2="110" y2="100" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
                <line x1="70" y1="120" x2="100" y2="120" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
                <circle cx="125" cy="125" r="25" fill="white" stroke="#6366F1" stroke-width="4"/>
                <line x1="143" y1="143" x2="160" y2="160" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
                <path d="M117 117L133 133M133 117L117 133" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
            </svg>
        `;

        // Initialize Page
        window.addEventListener('DOMContentLoaded', () => {
            renderView();
            lucide.createIcons();
            setTimeout(() => searchInput.focus(), 150);
        });

        // Handle Search Inputs
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 0) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
            renderView();
        });

        // Keyboard Submission (Enter Key)
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) {
                    addRecentSearch(query);
                }
            }
        });

        // Main Render Controller
        function renderView() {
            const query = searchInput.value.trim().toLowerCase();

            if (query === '') {
                renderRecentSearches();
            } else {
                const filtered = searchData.filter(item => {
                    const text = (item.title + ' ' + item.desc + ' ' + item.keywords.join(' ')).toLowerCase();
                    return text.includes(query);
                });

                if (filtered.length > 0) {
                    renderResults(filtered, query);
                } else {
                    renderEmptyState();
                }
            }
            lucide.createIcons();
        }

        // Render Recent Searches Screen
        function renderRecentSearches() {
            if (recentSearches.length === 0) {
                mainContent.innerHTML = '';
                return;
            }

            let html = `
                <section class="recent-section">
                    <h2 class="section-title">Recent Searches</h2>
                    <div class="recent-list">
            `;

            recentSearches.forEach((term, index) => {
                html += `
                    <div class="recent-item" onclick="executeSearch('${term}')">
                        <div class="recent-left">
                            <i data-lucide="clock" width="20" height="20" class="recent-icon"></i>
                            <span class="recent-text">${term}</span>
                        </div>
                        <button class="delete-btn" onclick="removeRecent(event, ${index})">
                            <i data-lucide="delete" width="20" height="20"></i>
                        </button>
                    </div>
                `;
            });

            html += `</div></section>`;
            mainContent.innerHTML = html;
        }

        // Render Search Results Screen
        function renderResults(results, query) {
            let html = `<div class="results-list">`;

            results.forEach(item => {
                html += `
                    <a href="${item.url}" class="result-card" onclick="addRecentSearch('${query}')">
                        <div class="result-thumb">
                            <i data-lucide="book-open" width="22" height="22"></i>
                        </div>
                        <div class="result-info">
                            <div class="result-title">${highlightText(item.title, query)}</div>
                            <div class="result-desc">${item.desc}</div>
                        </div>
                        <i data-lucide="chevron-right" width="20" height="20" style="color: #cbd5e1;"></i>
                    </a>
                `;
            });

            html += `</div>`;
            mainContent.innerHTML = html;
        }

        // Render "No courses found" Graphic State
        function renderEmptyState() {
            mainContent.innerHTML = `
                <div class="empty-state">
                    ${emptyDocSVG}
                    <div class="empty-title">No courses found</div>
                </div>
            `;
        }

        // Helpers & State Handlers
        function highlightText(text, query) {
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function executeSearch(term) {
            searchInput.value = term;
            clearBtn.classList.add('show');
            renderView();
        }

        function addRecentSearch(term) {
            if (!recentSearches.includes(term)) {
                recentSearches.unshift(term);
                if (recentSearches.length > 8) recentSearches.pop();
                localStorage.setItem('recentSearches', JSON.stringify(recentSearches));
            }
        }

        function removeRecent(event, index) {
            event.stopPropagation();
            recentSearches.splice(index, 1);
            localStorage.setItem('recentSearches', JSON.stringify(recentSearches));
            renderView();
        }

        function clearSearch() {
            searchInput.value = '';
            clearBtn.classList.remove('show');
            renderView();
            searchInput.focus();
        }

        function goBack() {
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = 'home.html';
            }
        }

        // Bottom Sheet Modal Handlers
        function openModal() {
            modalOverlay.classList.add('active');
        }

        function closeModal(e) {
            modalOverlay.classList.remove('active');
        }

        function playTutorial() {
            alert("Opening tutorial video...");
            closeModal();
        }
    </script>
</body>
</html>
