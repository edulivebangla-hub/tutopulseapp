<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutoGenius Smart Board Pro v5</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1e293b;
    --border: #d1d9e6;
    --blue: #4f46e5;
    --teal: #0ea5e9;
    --danger: #ef4444;
  }
  body.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --border: #334155;
  }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; transition: background 0.3s, color 0.3s, border 0.3s; }
  body { background: var(--bg); color: var(--text); overflow: hidden; }

  /* Login */
  #loginPage {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; background: linear-gradient(135deg, var(--teal), var(--blue));
  }
 .login-box {
    background: var(--card); padding: 32px; border-radius: 20px;
    width: 90%; max-width: 380px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25); animation: pop 0.4s ease;
    backdrop-filter: blur(10px);
  }
  @keyframes pop { from{transform:scale(0.9);opacity:0} to{transform:scale(1);opacity:1} }
 .login-box h1 { color: var(--blue); margin-bottom: 20px; font-size: 24px; }
 .login-box input {
    width: 100%; padding: 14px; margin-bottom: 14px;
    border: 2px solid var(--border); border-radius: 12px;
    background: var(--bg); color: var(--text); font-size: 16px; outline: none;
  }
 .login-box input:focus { border-color: var(--blue); }
 .login-btn {
    width: 100%; padding: 14px; background: var(--blue);
    color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 16px; cursor: pointer;
  }
 .login-btn:hover { filter: brightness(1.1); }
 .error { color: var(--danger); font-size: 14px; margin-top: 8px; }

  /* Board */
  #boardPage { display: none; height: 100vh; flex-direction: column; }
 .toolbar {
    display: flex; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    flex-wrap: wrap; align-items: center; overflow-x: auto;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); z-index: 20;
  }
  body.dark.toolbar { background: rgba(30,41,59,0.7); }
 .tool-btn {
    background: var(--bg); border: 2px solid var(--border);
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); transition: all 0.2s; flex-shrink: 0;
  }
 .tool-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
 .tool-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
 .color-picker { width: 42px; height: 42px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; background: none; }
 .control-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
 .range { width: 110px; accent-color: var(--blue); }
  label { font-size: 11px; color: var(--text); font-weight: 600; }

 .board-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #00000008, transparent); }
 .board-area { position: relative; overflow: hidden; background: var(--card); box-shadow: 0 0 30px rgba(0,0,0,0.15); border-radius: 12px; }
  #canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #canvas.select-mode { cursor: default; }

  /* Watermark */
 .watermark {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.05; pointer-events: none; z-index: 1;
    width: 400px; filter: grayscale(1);
  }

  /* Tutor Frame */
 .tutor-frame {
    position: absolute; top: 16px; right: 16px;
    width: 140px; background: var(--card);
    border: 3px solid var(--blue); border-radius: 16px;
    padding: 8px; text-align: center; z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
 .tutor-frame img { width: 100%; border-radius: 10px; margin-bottom: 6px; }
 .tutor-frame p { font-size: 13px; font-weight: 700; color: var(--blue); }

  /* Draggable Objects */
 .draggable {
    position: absolute; border: 2px dashed transparent;
    background: transparent; z-index: 5;
    min-width: 60px; min-height: 60px; touch-action: none;
  }
 .draggable.selected { border: 2px dashed var(--blue); background: rgba(79,70,229,0.08); }
 .resize-handle {
    width: 14px; height: 14px; background: var(--blue);
    position: absolute; right: -7px; bottom: -7px;
    cursor: nwse-resize; border-radius: 4px; border: 2px solid #fff;
    display: none;
  }
 .draggable.selected.resize-handle { display: block; } /* FIXED */
 .text-box { padding: 8px; outline: none; min-width: 120px; background: rgba(255,255,255,0.2); border-radius: 8px; }
  body.dark.text-box { background: rgba(0,0,0,0.2); }

 .hidden { display: none!important; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="login-box">
    <h1>TutoGenius Smart Board Pro</h1>
    <input type="text" id="uid" placeholder="Teacher UID: teacher1">
    <input type="password" id="pass" placeholder="Password: 1234">
    <button class="login-btn" onclick="login()">Login</button>
    <div class="error" id="error"></div>
    <p style="font-size:12px; margin-top:10px; opacity:0.7">Try: teacher1 / 1234</p>
  </div>
</div>

<!-- BOARD PAGE -->
<div id="boardPage">
  <div class="toolbar">
    <button class="tool-btn" data-tool="select" title="Select & Move"><i data-lucide="mouse-pointer-2"></i></button>
    <button class="tool-btn" data-tool="pen" title="Pen"><i data-lucide="pen"></i></button>
    <button class="tool-btn" data-tool="eraser" title="Eraser"><i data-lucide="eraser"></i></button>
    <button class="tool-btn" onclick="addText()" title="Text"><i data-lucide="type"></i></button>
    <button class="tool-btn" onclick="addImage()" title="Add Image"><i data-lucide="image"></i></button>
    <button class="tool-btn" onclick="addShape('rect')" title="Rectangle"><i data-lucide="square"></i></button>
    <button class="tool-btn" onclick="addShape('circle')" title="Circle"><i data-lucide="circle"></i></button>
    <input type="color" class="color-picker" id="colorPicker" value="#4f46e5" title="Color">
    <div class="control-group">
      <input type="range" class="range" id="sizePicker" min="2" max="50" value="5">
      <label>Size</label>
    </div>
    <div class="control-group">
      <input type="range" class="range" id="opacityPicker" min="0.1" max="1" step="0.1" value="1">
      <label>Opacity</label>
    </div>
    <button class="tool-btn" onclick="deleteSelected()" title="Delete Selected"><i data-lucide="trash"></i></button>
    <button class="tool-btn" onclick="undo()" title="Undo"><i data-lucide="undo-2"></i></button>
    <button class="tool-btn" onclick="redo()" title="Redo"><i data-lucide="redo-2"></i></button>
    <button class="tool-btn" onclick="clearBoard()" title="Clear All"><i data-lucide="trash-2"></i></button>
    <button class="tool-btn" id="orientationBtn" onclick="toggleOrientation()" title="Portrait/Landscape"><i data-lucide="smartphone"></i></button>
    <button class="tool-btn" onclick="toggleDark()" title="Dark Mode"><i data-lucide="moon"></i></button>
    <button class="tool-btn" onclick="downloadBoard()" title="Download"><i data-lucide="download"></i></button>
    <button class="tool-btn" onclick="logout()" title="Logout"><i data-lucide="log-out"></i></button>
  </div>

  <div class="board-wrapper">
    <div class="board-area" id="boardArea">
      <canvas id="canvas"></canvas>
      <img src="https://i.imgur.com/4M34hi2.jpg" class="watermark" alt="TutoGenius Logo">
      <div class="tutor-frame" id="tutorFrame">
        <img id="tutorLogo" src="" alt="Tutor">
        <p id="tutorName"></p>
      </div>
    </div>
  </div>
</div>

<input type="file" id="imageInput" class="hidden" accept="image/*">

<script>
lucide.createIcons();

// 3 Teachers Custom Data
const teachers = {
  teacher1: { pass: '1234', name: 'Aninda Halder', logo: 'https://i.imgur.com/4M34hi2.jpg' },
  teacher2: { pass: '1234', name: 'Priya Sharma', logo: 'https://i.imgur.com/8QpZ9yL.png' },
  teacher3: { pass: '1234', name: 'Rahul Singh', logo: 'https://i.imgur.com/1Z5w1yL.png' }
};

let currentTeacher = null;
let tool = 'pen';
let drawing = false;
let ctx, canvas;
let history = [];
let historyIndex = -1;
let isLandscape = true;
let selectedObj = null;

// Login
function login() {
  const uid = document.getElementById('uid').value.trim();
  const pass = document.getElementById('pass').value.trim();
  if (teachers[uid] && teachers[uid].pass === pass) {
    currentTeacher = teachers[uid];
    localStorage.setItem('tutoGenius_login', JSON.stringify({uid, pass}));
    showBoard();
  } else {
    document.getElementById('error').textContent = 'Invalid UID or Password';
  }
}

function autoLogin() {
  const saved = localStorage.getItem('tutoGenius_login');
  if(saved){
    const {uid, pass} = JSON.parse(saved);
    if(teachers[uid] && teachers[uid].pass === pass){
      currentTeacher = teachers[uid];
      showBoard();
    }
  }
}

function showBoard(){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('boardPage').style.display = 'flex';
  document.getElementById('tutorName').textContent = currentTeacher.name;
  document.getElementById('tutorLogo').src = currentTeacher.logo;
  initCanvas();
  setOrientation(true);
  setTool('pen');
}

function logout() {
  localStorage.removeItem('tutoGenius_login');
  location.reload();
}

function initCanvas() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  ['mousedown','touchstart'].forEach(evt => canvas.addEventListener(evt, startDraw));
  ['mousemove','touchmove'].forEach(evt => canvas.addEventListener(evt, draw));
  ['mouseup','touchend','mouseleave'].forEach(evt => canvas.addEventListener(evt, stopDraw));

  document.getElementById('colorPicker').oninput = updateStyle;
  document.getElementById('sizePicker').oninput = updateStyle;
  document.getElementById('opacityPicker').oninput = updateStyle;

  document.querySelectorAll('.tool-btn[data-tool]').forEach(btn=>{
    btn.onclick = () => setTool(btn.dataset.tool);
  });

  updateStyle();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  saveState();
}

function updateStyle(){
  ctx.strokeStyle = document.getElementById('colorPicker').value;
  ctx.lineWidth = document.getElementById('sizePicker').value;
  ctx.globalAlpha = document.getElementById('opacityPicker').value;
}

function resizeCanvas() {
  const area = document.getElementById('boardArea');
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
  restoreState();
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.tool-btn[data-tool="${t}"]`);
  if(btn) btn.classList.add('active');
  ctx.globalCompositeOperation = t === 'eraser'? 'destination-out' : 'source-over';
  canvas.className = t === 'select'? 'select-mode' : '';
  deselectAll();
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches? e.touches[0] : e;
  return {x: touch.clientX - rect.left, y: touch.clientY - rect.top};
}

function startDraw(e) {
  if (tool!== 'pen' && tool!== 'eraser') return;
  drawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}
function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
}
function stopDraw() {
  if (drawing) { drawing = false; saveState(); }
}

// Draggable + Select System
function deselectAll(){
  document.querySelectorAll('.draggable').forEach(d=>d.classList.remove('selected'));
  selectedObj = null;
}

function makeDraggable(el){
  let isDown = false, isResize = false, startX, startY, startW, startH;

  const down = (e) => {
    if(tool!== 'select') return;
    e.stopPropagation();
    const touch = e.touches? e.touches[0] : e;
    if(e.target.classList.contains('resize-handle')) {
      isResize = true; startW = el.offsetWidth; startH = el.offsetHeight;
    } else {
      isDown = true;
    }
    startX = touch.clientX; startY = touch.clientY;
    deselectAll(); el.classList.add('selected'); selectedObj = el;
  }

  const move = (e) => {
    if(tool!== 'select') return;
    const touch = e.touches? e.touches[0] : e;
    if(isDown){
      el.style.left = el.offsetLeft + touch.clientX - startX + 'px';
      el.style.top = el.offsetTop + touch.clientY - startY + 'px';
      startX = touch.clientX; startY = touch.clientY;
    }
    if(isResize){
      el.style.width = Math.max(50, startW + touch.clientX - startX) + 'px';
      el.style.height = Math.max(50, startH + touch.clientY - startY) + 'px';
    }
  }

  const up = () => {isDown = false; isResize = false;}

  el.addEventListener('mousedown', down);
  el.addEventListener('touchstart', down);
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move);
  document.addEventListener('mouseup', up);
  document.addEventListener('touchend', up);

  const handle = document.createElement('div');
  handle.className = 'resize-handle';
  el.appendChild(handle);

  document.getElementById('boardArea').onclick = () => { if(tool==='select') deselectAll(); }
}

function addText() {
  const div = document.createElement('div');
  div.className = 'draggable text-box';
  div.contentEditable = true;
  div.style.top = '120px';
  div.style.left = '120px';
  div.style.color = document.getElementById('colorPicker').value;
  div.style.fontSize = document.getElementById('sizePicker').value * 4 + 'px';
  div.style.opacity = document.getElementById('opacityPicker').value;
  div.innerText = 'Type here...';
  document.getElementById('boardArea').appendChild(div);
  makeDraggable(div);
  setTool('select');
}

function addImage() {
  document.getElementById('imageInput').click();
}
document.getElementById('imageInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  img.className = 'draggable';
  img.style.top = '120px';
  img.style.left = '120px';
  img.style.width = '250px';
  img.style.opacity = document.getElementById('opacityPicker').value;
  document.getElementById('boardArea').appendChild(img);
  makeDraggable(img);
  setTool('select');
}

function addShape(shape) {
  const div = document.createElement('div');
  div.className = 'draggable';
  div.style.top = '120px';
  div.style.left = '120px';
  div.style.width = '160px';
  div.style.height = '160px';
  div.style.border = `${document.getElementById('sizePicker').value}px solid ${document.getElementById('colorPicker').value}`;
  div.style.background = 'transparent';
  div.style.opacity = document.getElementById('opacityPicker').value;
  if(shape === 'circle') div.style.borderRadius = '50%';
  document.getElementById('boardArea').appendChild(div);
  makeDraggable(div);
  setTool('select');
}

function deleteSelected(){
  if(selectedObj) { selectedObj.remove(); selectedObj = null; }
}

function saveState() {
  historyIndex++;
  history = history.slice(0, historyIndex);
  history.push(canvas.toDataURL());
}
function restoreState() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (historyIndex >= 0) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = history[historyIndex];
  }
}
function undo() { if (historyIndex > 0) { historyIndex--; restoreState(); } }
function redo() { if (historyIndex < history.length-1) { historyIndex++; restoreState(); } }
function clearBoard() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.querySelectorAll('.draggable').forEach(d=>d.remove());
  saveState();
}

function toggleDark() { document.body.classList.toggle('dark'); }

function toggleOrientation() {
  isLandscape =!isLandscape;
  setOrientation(isLandscape);
}

function setOrientation(landscape){
  const area = document.getElementById('boardArea');
  const btn = document.getElementById('orientationBtn');
  if(landscape){
    area.style.width = '95vw';
    area.style.height = '75vh';
    btn.innerHTML = '<i data-lucide="smartphone"></i>';
  } else {
    area.style.width = '45vh';
    area.style.height = '80vh';
    btn.innerHTML = '<i data-lucide="monitor"></i>';
  }
  lucide.createIcons();
  setTimeout(resizeCanvas, 100);
}

function downloadBoard() {
  const link = document.createElement('a');
  link.download = 'SmartBoard_' + currentTeacher.name + '.png';
  link.href = canvas.toDataURL();
  link.click();
}

autoLogin();
</script>

</body>
</html>
