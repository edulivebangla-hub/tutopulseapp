<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notifications - EduLive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --primary: #0555E8;
    --primary-light: #eef4ff;
    --primary-hover: #0444ba;
    --bg-surface: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 10px 25px -5px rgba(5, 85, 232, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    --radius-lg: 16px;
    --radius-md: 12px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg-surface);
    color: var(--text-main);
    display: flex;
    justify-content: center;
  }

  .app-shell {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    box-shadow: 0 0 50px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
  }

  /* HEADER DESIGN */
  .header {
    background: var(--primary);
    padding: 5px; width: 100%; height: 50px;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(5, 85, 232, 0.15);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background 0.2s;
  }

  .back-btn:active {
    background: rgba(255, 255, 255, 0.3);
  }

  .back-btn i {
    width: 20px;
    height: 20px;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header-badge {
    background: rgba(255, 255, 255, 0.2);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  /* CONTAINER & LIST */
  .container {
    padding: 16px;
    flex: 1;
    background: var(--bg-surface);
  }

  /* EMPTY STATE */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
  }

  .empty-icon-box {
    width: 90px;
    height: 90px;
    background: var(--primary-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    color: var(--primary);
  }

  .empty h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
  }

  .empty p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 240px;
    line-height: 1.5;
  }

  /* NOTIFICATION LIST */
  .noti-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .noti-card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    gap: 14px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    position: relative;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-sm);
  }

  .noti-card:hover {
    box-shadow: var(--shadow-md);
    border-color: rgba(5, 85, 232, 0.2);
  }

  .noti-card:active {
    transform: scale(0.99);
    background: #f8fafc;
  }

  .noti-card.unread {
    background: #ffffff;
    border-color: rgba(5, 85, 232, 0.25);
  }

  .noti-card.unread::before {
    content: '';
    position: absolute;
    top: 18px;
    right: 16px;
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
  }

  .noti-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 8px;
  }

  .noti-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
  }

  .noti-content {
    flex: 1;
    padding-right: 18px;
  }

  .noti-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .noti-text {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .noti-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .noti-time {
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .delete-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s;
  }

  .delete-btn:hover {
    background: var(--danger-light);
    color: var(--danger);
  }

  /* BOTTOM SHEET POPUP */
  .popup {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .popup.show {
    opacity: 1;
    pointer-events: auto;
  }

  .popup-box {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 24px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 85vh;
    overflow-y: auto;
  }

  .popup.show .popup-box {
    transform: translateY(0);
  }

  .popup-drag-handle {
    width: 36px;
    height: 4px;
    background: var(--border-color);
    border-radius: 2px;
    margin: 0 auto 16px auto;
  }

  .popup-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .popup-header h2 {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text-main);
  }

  .popup-close {
    cursor: pointer;
    width: 32px;
    height: 32px;
    background: var(--bg-surface);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .popup-img {
    width: 100%;
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    max-height: 220px;
    object-fit: cover;
  }

  .popup-text {
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 20px;
    color: #334155;
  }

  .popup-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    padding: 8px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

/* APPLICATION CONTAINER MAIN */
.app-container {
    position: fixed; top: 50px; bottom: 65px; width: 100%; overflow-y: auto;
    background: var(--bg); scrollbar-width: none; -ms-overflow-style: none;
    will-change: scroll-position;
}
.app-container::-webkit-scrollbar { display: none; }
.content { padding: 0 16px; }

</style>
</head>
<body>

<div class="app-shell">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="back-btn" onclick="handleHeaderBack()">
        <i data-lucide="arrow-left"></i>
      </div>
      <h1>Notifications</h1>
    </div>
    <div class="header-badge" id="unreadBadge">0 New</div>
  </div>
<main class="app-container">
  <div class="container">
    <!-- EMPTY STATE -->
    <div class="empty" id="emptyState" style="display: none;">
      <div class="empty-icon-box">
        <i data-lucide="bell-off" style="width: 40px; height: 40px;"></i>
      </div>
      <h3>No Notifications Yet</h3>
      <p>We'll notify you when important updates or new classes are available.</p>
    </div>

    <!-- NOTIFICATION LIST -->
    <div class="noti-list" id="notiList"></div>
  </div>
</div>
</main>
<!-- BOTTOM POPUP -->
<div class="popup" id="popup" onclick="closePopup(event)">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-drag-handle"></div>
    <div class="popup-header">
      <h2 id="popupTitle">Title</h2>
      <div class="popup-close" onclick="closePopup()"><i data-lucide="x" style="width: 18px; height: 18px;"></i></div>
    </div>
    <img src="" id="popupImg" class="popup-img">
    <div id="popupText" class="popup-text"></div>
    <div id="popupDate" class="popup-date"></div>
  </div>
</div>

<script>
lucide.createIcons();

const defaultNotifications = [
  {
    id: "n-1",
    title: "HS বাংলা সাজেশন 2026 আপডেট",
    text: "তৃতীয় সেমিস্টারের জন্য নতুন সাজেশন আপলোড করা হয়েছে। এখনই চেক করুন।",
    img: "https://i.ibb.co/1pF4mN2/nsou.jpg",
    time: new Date().toISOString(),
    viewed: false
  },
  {
    id: "n-2", 
    title: "New Video Class Live",
    text: "Class 12 English Chapter 1 এর Live Class আজ রাত 8টায়।",
    img: "https://i.ibb.co/6nL3v4B/banner3.jpg",
    time: new Date().toISOString(),
    viewed: false
  }
];

let notifications = JSON.parse(localStorage.getItem('edulive_notifications') || '[]');
if(notifications.length === 0){
  notifications = defaultNotifications;
  saveNotifications();
}

function saveNotifications(){
  localStorage.setItem('edulive_notifications', JSON.stringify(notifications));
}

function renderNotifications(){
  const list = document.getElementById('notiList');
  const empty = document.getElementById('emptyState');
  const badge = document.getElementById('unreadBadge');
  
  const unreadCount = notifications.filter(n => !n.viewed).length;
  badge.textContent = `${unreadCount} New`;

  if(notifications.length === 0){
    empty.style.display = 'flex';
    list.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = '';
  notifications.forEach(noti => {
    const date = new Date(noti.time);
    const timeStr = date.toLocaleTimeString('en-IN', {hour: '2-digit', minute:'2-digit'});
    const dateStr = date.toLocaleDateString('en-IN', {day: '2-digit', month: 'short'});
    
    list.innerHTML += `
      <div class="noti-card ${noti.viewed ? '' : 'unread'}" onclick="openPopup('${noti.id}')">
        <div class="noti-icon">
          <img src="https://i.ibb.co/Vm3hYg2/logo.png" alt="EduLive">
        </div>
        <div class="noti-content">
          <div class="noti-title">${noti.title}</div>
          <div class="noti-text">${noti.text}</div>
          <div class="noti-footer">
            <span class="noti-time">
              <i data-lucide="clock" style="width: 12px; height: 12px;"></i>
              ${timeStr} • ${dateStr}
            </span>
          </div>
        </div>
        <div class="delete-btn" onclick="deleteNoti(event, '${noti.id}')" title="Delete">
          <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
        </div>
      </div>
    `;
  });
  lucide.createIcons();
}

/* --- URL ROUTING & BACK SYSTEM --- */

function handleHeaderBack() {
  const popup = document.getElementById('popup');
  if (popup.classList.contains('show')) {
    closePopupUI();
    cleanUrlPath();
  } else {
    if (document.referrer && document.referrer !== window.location.href) {
      history.back();
    } else {
      window.location.href = '/';
    }
  }
}

function getNotificationIdFromPath() {
  const path = window.location.pathname;
  const match = path.match(/\/(n-\d+)$/);
  if (match) return match[1];
  return window.location.hash.replace('#', '');
}

function updateUrlPath(id) {
  const newPath = `/${id}`;
  if (window.location.pathname !== newPath) {
    history.pushState({ popupOpen: true, id: id }, '', newPath);
  }
}

function cleanUrlPath() {
  if (window.location.pathname !== '/' && window.location.pathname !== '') {
    history.pushState(null, '', '/');
  }
}

function openPopup(id){
  const noti = notifications.find(n => n.id === id);
  if(!noti) return;

  if(!noti.viewed){
    noti.viewed = true;
    noti.viewTime = new Date().toISOString();
    saveNotifications();
    renderNotifications();
  }

  document.getElementById('popupTitle').textContent = noti.title;
  document.getElementById('popupText').textContent = noti.text;
  
  const imgEl = document.getElementById('popupImg');
  if(noti.img) {
    imgEl.src = noti.img;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }
  
  const date = new Date(noti.viewTime || noti.time);
  document.getElementById('popupDate').innerHTML = `
    <i data-lucide="check-circle-2" style="width: 14px; height: 14px;"></i> 
    Viewed: ${date.toLocaleTimeString('en-IN', {hour: '2-digit', minute:'2-digit'})} • ${date.toLocaleDateString('en-IN', {day: '2-digit', month: 'short', year: 'numeric'})}
  `;

  document.getElementById('popup').classList.add('show');
  lucide.createIcons();
  updateUrlPath(id);
}

function closePopupUI() {
  document.getElementById('popup').classList.remove('show');
}

function closePopup(e){
  if(!e || e.target.id === 'popup' || e.target.closest('.popup-close')){
    closePopupUI();
    cleanUrlPath();
  }
}

function deleteNoti(e, id){
  e.stopPropagation();
  notifications = notifications.filter(n => n.id !== id);
  saveNotifications();
  renderNotifications();
}

/* --- EVENT LISTENERS --- */

window.addEventListener('popstate', (e) => {
  const notiId = getNotificationIdFromPath();
  if (notiId) {
    openPopup(notiId);
  } else {
    closePopupUI();
  }
});

window.addEventListener('load', () => {
  renderNotifications();
  const directId = getNotificationIdFromPath();
  if(directId) {
    openPopup(directId);
  }
});

function addNotification(title, text, img){
  const newId = "n-" + (notifications.length + 1);
  notifications.unshift({
    id: newId,
    title, text, img,
    time: new Date().toISOString(),
    viewed: false
  });
  saveNotifications();
  renderNotifications();
}
</script>
</body>
</html>
