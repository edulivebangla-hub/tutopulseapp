<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Wallet</title>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-light: #e6f7ff;
            --blue-primary: #0066ff;
            --blue-hover: #0052cc;
            --green-btn: #00c853;
            --red-btn: #ff3333;
            --text-dark: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Container Frame */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Top Header Navigation */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--bg-light);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #b3e5fc;
            background: #fff;
            color: var(--blue-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .top-action-btn {
            background-color: var(--green-btn);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .top-action-btn.switch {
            background-color: var(--red-btn);
        }

        /* Views */
        .view {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        /* --- LOGIN & REGISTRATION STYLE --- */
        .auth-view {
            background-color: var(--bg-light);
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
        }

        .auth-title {
            color: var(--blue-primary);
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 16px;
            text-align: center;
        }

        .custom-input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--blue-primary);
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            outline: none;
            background: #fff;
            color: #333;
        }

        .input-label {
            color: var(--blue-primary);
            font-weight: 800;
            font-size: 16px;
            margin-top: 6px;
        }

        .btn-submit {
            background-color: var(--blue-primary);
            color: white;
            border: none;
            width: 140px;
            padding: 10px 0;
            border-radius: 20px;
            font-size: 22px;
            font-weight: 700;
            margin-top: 15px;
            cursor: pointer;
        }

        /* --- DASHBOARD VIEW STYLE --- */
        .dashboard-view {
            background-color: #ffffff;
            padding: 0;
        }

        .top-card-section {
            background-color: var(--bg-light);
            padding: 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .user-qr-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .qr-box {
            background: #fff;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-info-text {
            color: var(--blue-primary);
            font-weight: 800;
            font-size: 15px;
        }

        .user-info-text span {
            color: #000;
        }

        .btn-small-blue {
            background-color: var(--blue-primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
            width: fit-content;
        }

        /* Wallet Balance Pill */
        .wallet-pill {
            background: #fff;
            border-radius: 30px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .wallet-pill-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wallet-icon {
            width: 36px;
            height: 36px;
            background: #22c55e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .wallet-title {
            font-size: 13px;
            font-weight: 800;
            color: #000;
        }

        .wallet-amount {
            font-size: 15px;
            font-weight: 800;
            color: #000;
        }

        .pill-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-icon {
            color: var(--blue-primary);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add {
            background-color: var(--blue-primary);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        /* Dashboard Main Action Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
        }

        .action-card {
            background-color: #f1f8fe;
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .action-card-icon {
            color: var(--blue-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-card-title {
            color: var(--blue-primary);
            font-weight: 800;
            font-size: 14px;
        }

        /* Footer Payments Display */
        .payments-footer {
            margin-top: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        .phonepe { color: #5f259f; }
        .paytm { color: #00baf2; }
        .gpay { color: #5f6368; }

        /* Toast Popup */
        #toast-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 85%;
        }

        .toast {
            background: #0f172a;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.success { border-left: 4px solid #22c55e; }

        /* --- POPUP / MODAL OVERLAY STYLES --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: scaleUp 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-icon-badge {
            width: 52px;
            height: 52px;
            background-color: var(--bg-light);
            color: var(--blue-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .modal-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-top: -6px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 6px;
        }

        .btn-modal-cancel {
            flex: 1;
            background-color: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-modal-confirm {
            flex: 1;
            background-color: var(--blue-primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="toast-container"></div>

    <!-- HEADER -->
    <div class="header">
        <div class="back-btn">
            <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
        </div>
        <button id="topNavBtn" class="top-action-btn" onclick="toggleAuthMode()">Create New</button>
    </div>

    <!-- VIEW 1: LOGIN / REGISTER -->
    <div id="authView" class="view auth-view">
        <h2 id="authTitle" class="auth-title">Wallet Login</h2>

        <div class="input-group">
            <input type="text" id="uidInput" class="custom-input" placeholder="TGXXXXX" style="text-transform: uppercase;">
            <div class="input-label">Enter Your U ID</div>
        </div>

        <div class="input-group">
            <input type="password" id="keyInput" class="custom-input" maxlength="6" pattern="\d{6}" placeholder="* * * * * *" inputmode="numeric">
            <div class="input-label">Enter Your Key</div>
        </div>

        <button id="authSubmitBtn" class="btn-submit" onclick="handleAuth()">Login</button>
    </div>

    <!-- VIEW 2: DASHBOARD -->
    <div id="dashboardView" class="view dashboard-view hidden">
        <div class="top-card-section">
            <div class="user-qr-row">
                <div class="qr-box">
                    <div id="qrcode"></div>
                </div>
                <div class="user-details">
                    <div class="user-info-text">U ID: <span id="dashUid">TGXXXXX</span></div>
                    <div class="user-info-text">KEY : <span id="dashKey">******</span></div>
                    <button class="btn-small-blue" onclick="openChangeKeyModal()">Change Key</button>
                </div>
            </div>

            <!-- Wallet Balance Card -->
            <div class="wallet-pill">
                <div class="wallet-pill-left">
                    <div class="wallet-icon">
                        <i data-lucide="wallet" style="width: 20px; height: 20px;"></i>
                    </div>
                    <div>
                        <div class="wallet-title">TG Wallet</div>
                        <div class="wallet-amount">&#8377; <span id="dashBalance">0.00</span></div>
                    </div>
                </div>
                <div class="pill-actions">
                    <span class="refresh-icon" onclick="refreshBalance()">
                        <i data-lucide="rotate-cw" style="width: 18px; height: 18px;"></i>
                    </span>
                    <button class="btn-add" onclick="openGiftModal()">Add</button>
                </div>
            </div>
        </div>

        <!-- Center Actions -->
        <div class="action-grid">
            <div class="action-card" onclick="showAlert('Pay Online feature coming soon!')">
                <div class="action-card-icon">
                    <i data-lucide="qr-code" style="width: 32px; height: 32px;"></i>
                </div>
                <div class="action-card-title">Pay Online</div>
            </div>
            <div class="action-card" onclick="showAlert('No recent transactions.')">
                <div class="action-card-icon">
                    <i data-lucide="history" style="width: 32px; height: 32px;"></i>
                </div>
                <div class="action-card-title">Transactions</div>
            </div>
        </div>

        <!-- Logos Footer -->
        <div class="payments-footer">
            <div class="brand-logos">
                <span class="brand-logo phonepe"><span style="background:#5f259f;color:white;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:2px;">&#2346;</span> PhonePe</span>
                <span class="brand-logo paytm"><span style="color:#002e6e">Pay</span>tm</span>
                <span class="brand-logo gpay"><span style="color:#4285f4">G</span><span style="color:#ea4335">P</span><span style="color:#fbbc05">a</span><span style="color:#34a853">y</span></span>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL 1: CHANGE KEY -->
    <div id="changeKeyModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-icon-badge">
                <i data-lucide="key-round" style="width: 24px; height: 24px;"></i>
            </div>
            <div class="modal-title">Change Secret Key</div>
            <div class="modal-subtitle">Enter a new 6-digit numeric key</div>
            
            <input type="password" id="newKeyInput" class="custom-input" maxlength="6" pattern="\d{6}" placeholder="* * * * * *" inputmode="numeric">
            
            <div class="modal-actions">
                <button class="btn-modal-cancel" onclick="closeModal('changeKeyModal')">Cancel</button>
                <button class="btn-modal-confirm" onclick="submitNewKey()">Update</button>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL 2: ENTER GIFT CODE -->
    <div id="giftModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-icon-badge">
                🎁
            </div>
            <div class="modal-title">Redeem Gift Code</div>
            <div class="modal-subtitle">Enter code to add balance directly</div>
            
            <input type="text" id="giftCodeInput" class="custom-input" placeholder="GIFT2026" style="text-transform: uppercase;">
            
            <div class="modal-actions">
                <button class="btn-modal-cancel" onclick="closeModal('giftModal')">Cancel</button>
                <button class="btn-modal-confirm" onclick="submitGiftCode()">Redeem</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, doc, getDoc, setDoc, updateDoc, runTransaction, onSnapshot, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCfd1bdt9dWsRKkX9xLFB_7Hf7GmZFZBag",
        authDomain: "tutogenius-1.firebaseapp.com",
        projectId: "tutogenius-1",
        storageBucket: "tutogenius-1.firebasestorage.app",
        messagingSenderId: "65839146612",
        appId: "1:65839146612:web:4e54c6ad4cea4bc5859321"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let isCreateMode = false;
    let qrCodeInstance = null;
    let unsubSnapshot = null;

    document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
    });

    function showAlert(msg, type = "info") {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    window.closeModal = function(id) {
        document.getElementById(id).classList.add('hidden');
    };

    window.toggleAuthMode = function() {
        isCreateMode = !isCreateMode;
        const navBtn = document.getElementById('topNavBtn');
        const title = document.getElementById('authTitle');
        const submitBtn = document.getElementById('authSubmitBtn');
        const uidInput = document.getElementById('uidInput');

        if (isCreateMode) {
            navBtn.textContent = "Login";
            title.textContent = "Create Account";
            submitBtn.textContent = "Register";
            uidInput.placeholder = "Auto-Generated";
            uidInput.disabled = true;
            uidInput.value = "";
        } else {
            navBtn.textContent = "Create New";
            title.textContent = "Wallet Login";
            submitBtn.textContent = "Login";
            uidInput.placeholder = "TGXXXXX";
            uidInput.disabled = false;
        }
    };

    window.handleAuth = async function() {
        const key = document.getElementById('keyInput').value.trim();

        if (!/^\d{6}$/.test(key)) {
            showAlert("Key must be exactly 6 numeric digits!", "error");
            return;
        }

        if (isCreateMode) {
            try {
                const newUid = await runTransaction(db, async (transaction) => {
                    const metaRef = doc(db, "metadata", "users");
                    const metaSnap = await transaction.get(metaRef);
                    const nextId = (metaSnap.exists() ? (metaSnap.data().lastId || 0) : 0) + 1;
                    const formattedId = "TG" + String(nextId).padStart(4, "0");

                    transaction.set(metaRef, { lastId: nextId }, { merge: true });
                    transaction.set(doc(db, "users", formattedId), {
                        key: key,
                        balance: 0.00
                    });
                    return formattedId;
                });

                showAlert(`Created! Your ID is ${newUid}`, "success");
                localStorage.setItem('tg_uid', newUid);
                localStorage.setItem('tg_key', key);
                loadDashboard(newUid, key);
            } catch (e) {
                showAlert("Registration failed: " + e.message, "error");
            }
        } else {
            const uid = document.getElementById('uidInput').value.trim().toUpperCase();
            if (!uid) {
                showAlert("Please enter your U ID", "error");
                return;
            }

            try {
                const userSnap = await getDoc(doc(db, "users", uid));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    if (data.key === key) {
                        showAlert("Login successful!", "success");
                        localStorage.setItem('tg_uid', uid);
                        localStorage.setItem('tg_key', key);
                        loadDashboard(uid, key);
                    } else {
                        showAlert("Incorrect 6-digit key!", "error");
                    }
                } else {
                    showAlert("U ID not found!", "error");
                }
            } catch (e) {
                showAlert("Login error: " + e.message, "error");
            }
        }
    };

    function generateQRCode(text) {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";
        qrCodeInstance = new QRCode(qrContainer, {
            text: text,
            width: 98,
            height: 98,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function loadDashboard(uid, key) {
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');

        const navBtn = document.getElementById('topNavBtn');
        navBtn.textContent = "Switch";
        navBtn.className = "top-action-btn switch";
        navBtn.onclick = logout;

        document.getElementById('dashUid').textContent = uid;
        document.getElementById('dashKey').textContent = key;

        generateQRCode(`UID:${uid}\vert{}KEY:${key}`);

        setTimeout(() => lucide.createIcons(), 50);

        if (unsubSnapshot) unsubSnapshot();
        unsubSnapshot = onSnapshot(doc(db, "users", uid), (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('dashBalance').textContent = Number(data.balance || 0).toFixed(2);
            }
        });
    }

    /* POPUP: CHANGE KEY */
    window.openChangeKeyModal = function() {
        document.getElementById('newKeyInput').value = "";
        document.getElementById('changeKeyModal').classList.remove('hidden');
    };

    window.submitNewKey = async function() {
        const newKey = document.getElementById('newKeyInput').value.trim();
        if (!/^\d{6}$/.test(newKey)) {
            showAlert("Key must be 6 numeric digits!", "error");
            return;
        }

        const uid = localStorage.getItem('tg_uid');
        try {
            await updateDoc(doc(db, "users", uid), { key: newKey });
            localStorage.setItem('tg_key', newKey);
            document.getElementById('dashKey').textContent = newKey;
            generateQRCode(`UID:${uid}\vert{}KEY:${newKey}`);
            closeModal('changeKeyModal');
            showAlert("Key updated successfully!", "success");
        } catch (e) {
            showAlert("Failed to change key", "error");
        }
    };

    /* POPUP: GIFT CODE / ADD MONEY */
    window.openGiftModal = function() {
        document.getElementById('giftCodeInput').value = "";
        document.getElementById('giftModal').classList.remove('hidden');
    };

    window.submitGiftCode = async function() {
        const codeInput = document.getElementById('giftCodeInput').value.trim().toUpperCase();
        if (!codeInput) {
            showAlert("Please enter a gift code", "error");
            return;
        }

        const uid = localStorage.getItem('tg_uid');

        try {
            await runTransaction(db, async (transaction) => {
                const codeRef = doc(db, "gift_codes", codeInput);
                const codeSnap = await transaction.get(codeRef);

                if (!codeSnap.exists()) {
                    throw new Error("Invalid gift code!");
                }

                const codeData = codeSnap.data();

                if (codeData.active === false) {
                    throw new Error("This code is expired!");
                }

                const usedBy = codeData.usedBy || [];
                if (usedBy.includes(uid)) {
                    throw new Error("You have already used this code once!");
                }

                const giftAmount = Number(codeData.amount || 0);
                if (giftAmount <= 0) {
                    throw new Error("Invalid code value!");
                }

                const userRef = doc(db, "users", uid);
                const userSnap = await transaction.get(userRef);
                if (!userSnap.exists()) throw new Error("User record missing!");

                // Update balance and track redemption
                const currentBal = Number(userSnap.data().balance || 0);
                transaction.update(userRef, { balance: currentBal + giftAmount });
                transaction.update(codeRef, { usedBy: arrayUnion(uid) });
            });

            closeModal('giftModal');
            showAlert("Gift Code Redeemed Successfully!", "success");
        } catch (e) {
            showAlert(e.message || "Failed to redeem code", "error");
        }
    };

    window.refreshBalance = function() {
        showAlert("Balance updated", "success");
    };

    function logout() {
        localStorage.removeItem('tg_uid');
        localStorage.removeItem('tg_key');
        if (unsubSnapshot) unsubSnapshot();

        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('authView').classList.remove('hidden');

        const navBtn = document.getElementById('topNavBtn');
        navBtn.textContent = "Create New";
        navBtn.className = "top-action-btn";
        navBtn.onclick = toggleAuthMode;

        isCreateMode = true;
        toggleAuthMode();
        showAlert("Logged out", "info");

        setTimeout(() => lucide.createIcons(), 50);
    }

    const savedUid = localStorage.getItem('tg_uid');
    const savedKey = localStorage.getItem('tg_key');
    if (savedUid && savedKey) {
        loadDashboard(savedUid, savedKey);
    }
</script>
</body>
</html>
