<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutogenius Auth & Profile System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-card {
      width: 100%;
      max-width: 414px;
      background: #ffffff;
      min-height: 100vh;
      padding: 24px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    @media (min-width: 480px) {
      .app-card {
        min-height: 720px;
        border-radius: 24px;
      }
    }

    .close-btn {
      align-self: flex-start;
      background: none;
      border: none;
      font-size: 20px;
      color: #0f172a;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .header-title {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }

    .google-btn {
      width: 100%;
      background-color: #4285f4;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .google-icon-wrapper {
      width: 24px;
      height: 24px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-dropdown-btn {
      background-color: #f1f5f9;
      color: #475569;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 auto 20px auto;
      cursor: pointer;
    }

    .divider {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin: 16px 0 24px 0;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-group i.left-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
    }

    .input-group i.right-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
      cursor: pointer;
    }

    .input-field {
      width: 100%;
      padding: 14px 44px;
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 12px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
    }

    .input-field:focus {
      border-color: #3b82f6;
      background-color: #ffffff;
    }

    .forgot-link {
      display: block;
      text-align: right;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 24px;
    }

    .primary-btn {
      width: 100%;
      background-color: #2b4bbb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .switch-mode {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .switch-mode span {
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }

    .terms-text {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: auto;
      line-height: 1.5;
    }

    .terms-text a {
      color: #2563eb;
      text-decoration: underline;
    }

    .profile-card {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #e2e8f0;
      margin-bottom: 16px;
    }

    .avatar-skeleton {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .avatar-img.loaded {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <button class="close-btn"><i class="fa-solid fa-xmark"></i></button>

    <div id="authWrapper">
      <h1 class="header-title" id="pageTitle">Login</h1>
      <p class="header-subtitle" id="pageSubtitle">Unlock all features with Just one tap</p>

      <button class="google-btn" id="googleSignInBtn">
        <div class="google-icon-wrapper">
          <svg width="14" height="14" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.03C2.47 16 5.51 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.8c-.18-.53-.28-1.1-.28-1.8s.1-1.27.28-1.8L.97 4.97C.35 6.2.0 7.56.0 9.0s.35 2.8 1.0 4.03l2.87-2.23z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.51 0 2.47 2 1.0 4.97l2.87 2.23C4.59 5.05 6.62 3.58 9 3.58z"/></svg>
        </div>
        Sign in with Google
      </button>

      <button class="toggle-dropdown-btn" id="toggleDropdownBtn">
        <span id="dropdownText">More sign-in options</span>
        <i class="fa-solid fa-chevron-down" id="dropdownIcon"></i>
      </button>

      <div class="divider hidden" id="dividerText">--- OR ---</div>

      <form id="authForm">
        <div class="input-group hidden" id="nameGroup">
          <i class="fa-regular fa-user left-icon"></i>
          <input type="text" class="input-field" id="nameInput" placeholder="Name">
        </div>

        <div id="emailFormFields" class="hidden">
          <div class="input-group">
            <i class="fa-regular fa-envelope left-icon"></i>
            <input type="email" class="input-field" id="emailInput" placeholder="Email">
            <i class="fa-solid fa-xmark right-icon" id="clearEmailBtn"></i>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock left-icon"></i>
            <input type="password" class="input-field" id="passwordInput" placeholder="Password">
            <i class="fa-regular fa-eye-slash right-icon" id="togglePasswordBtn"></i>
          </div>

          <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>

          <button type="submit" class="primary-btn" id="submitBtn">Login</button>
        </div>
      </form>

      <div class="switch-mode">
        <span id="switchPrompt">Don't have an account?</span>
        <span id="switchBtn">Create Account</span>
      </div>

      <p class="terms-text">
        By SigningUp/Logging In, You agree to our<br>
        <a href="#">Terms of Services</a> and <a href="#">Privacy Policy</a>
      </p>
    </div>

    <div class="profile-card" id="profileCard">
      <div class="avatar-wrapper">
        <div class="avatar-skeleton" id="avatarSkeleton"></div>
        <img src="" alt="Profile Photo" class="avatar-img" id="userAvatar">
      </div>
      <h2 class="header-title" id="profileName">User Name</h2>
      <p class="header-subtitle" id="profileEmail">user@example.com</p>

      <button class="primary-btn" id="logoutBtn" style="background-color: #ef4444;">Logout</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfd1bdt9dWsRKkX9xLFB_7Hf7GmZFZBag",
      authDomain: "tutogenius-1.firebaseapp.com",
      databaseURL: "https://tutogenius-1-default-rtdb.firebaseio.com",
      projectId: "tutogenius-1",
      storageBucket: "tutogenius-1.firebasestorage.app",
      messagingSenderId: "65839146612",
      appId: "1:65839146612:web:4e54c6ad4cea4bc5859321",
      measurementId: "G-1SQ3GKN5D7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elements
    const authWrapper = document.getElementById('authWrapper');
    const profileCard = document.getElementById('profileCard');
    const pageTitle = document.getElementById('pageTitle');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const toggleDropdownBtn = document.getElementById('toggleDropdownBtn');
    const dropdownText = document.getElementById('dropdownText');
    const dropdownIcon = document.getElementById('dropdownIcon');
    const dividerText = document.getElementById('dividerText');
    const nameGroup = document.getElementById('nameGroup');
    const emailFormFields = document.getElementById('emailFormFields');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const submitBtn = document.getElementById('submitBtn');
    const switchPrompt = document.getElementById('switchPrompt');
    const switchBtn = document.getElementById('switchBtn');
    const authForm = document.getElementById('authForm');
    
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    
    const userAvatar = document.getElementById('userAvatar');
    const avatarSkeleton = document.getElementById('avatarSkeleton');
    const profileName = document.getElementById('profileName');
    const profileEmail = document.getElementById('profileEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    let isLoginMode = true;

    function setAuthMode(isLogin) {
      isLoginMode = isLogin;
      if (isLogin) {
        pageTitle.textContent = "Login";
        pageSubtitle.textContent = "Unlock all features with Just one tap";
        toggleDropdownBtn.classList.remove('hidden');
        dividerText.classList.add('hidden');
        nameGroup.classList.add('hidden');
        emailFormFields.classList.add('hidden');
        dropdownText.textContent = "More sign-in options";
        dropdownIcon.className = "fa-solid fa-chevron-down";
        switchPrompt.textContent = "Don't have an account? ";
        switchBtn.textContent = "Create Account";
        submitBtn.textContent = "Login";
      } else {
        pageTitle.textContent = "Create Account";
        pageSubtitle.textContent = "Follow simple Steps";
        toggleDropdownBtn.classList.add('hidden');
        dividerText.classList.remove('hidden');
        nameGroup.classList.remove('hidden');
        emailFormFields.classList.remove('hidden');
        forgotPasswordLink.classList.add('hidden');
        switchPrompt.textContent = "Already have an account? ";
        switchBtn.textContent = "Login";
        submitBtn.textContent = "Create Account";
      }
    }

    switchBtn.addEventListener('click', () => setAuthMode(!isLoginMode));

    toggleDropdownBtn.addEventListener('click', () => {
      const isHidden = emailFormFields.classList.contains('hidden');
      if (isHidden) {
        emailFormFields.classList.remove('hidden');
        dropdownText.textContent = "Hide email sign-in";
        dropdownIcon.className = "fa-solid fa-chevron-up";
      } else {
        emailFormFields.classList.add('hidden');
        dropdownText.textContent = "More sign-in options";
        dropdownIcon.className = "fa-solid fa-chevron-down";
      }
    });

    async function saveUserData(user, name, photoURL) {
      const userRef = doc(db, "users", user.uid);
      const defaultPhoto = photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'User')}&background=random`;
      
      await setDoc(userRef, {
        uid: user.uid,
        name: name || user.displayName || "User",
        email: user.email,
        photoURL: defaultPhoto,
        updatedAt: new Date().toISOString()
      }, { merge: true });
    }

    googleSignInBtn.addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        await saveUserData(result.user, result.user.displayName, result.user.photoURL);
      } catch (err) {
        alert(err.message);
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const name = nameInput.value.trim();

      if (!email || !password) {
        alert("Please fill in email and password.");
        return;
      }

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          if (!name) { alert("Please enter your name."); return; }
          const res = await createUserWithEmailAndPassword(auth, email, password);
          await saveUserData(res.user, name, null);
        }
      } catch (err) {
        alert(err.message);
      }
    });

    function loadProfileImage(url) {
      avatarSkeleton.style.display = 'block';
      userAvatar.classList.remove('loaded');

      const imgLoader = new Image();
      imgLoader.src = url;
      imgLoader.onload = () => {
        userAvatar.src = url;
        userAvatar.classList.add('loaded');
        avatarSkeleton.style.display = 'none';
      };
      imgLoader.onerror = () => {
        userAvatar.src = `https://ui-avatars.com/api/?name=User&background=random`;
        userAvatar.classList.add('loaded');
        avatarSkeleton.style.display = 'none';
      };
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        authWrapper.style.display = 'none';
        profileCard.style.display = 'flex';

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            profileName.textContent = data.name;
            profileEmail.textContent = data.email;
            loadProfileImage(data.photoURL);
          } else {
            profileName.textContent = user.displayName || "User";
            profileEmail.textContent = user.email;
            loadProfileImage(user.photoURL || `https://ui-avatars.com/api/?name=User&background=random`);
          }
        } catch (e) {
          profileName.textContent = user.displayName || "User";
          profileEmail.textContent = user.email;
        }
      } else {
        authWrapper.style.display = 'block';
        profileCard.style.display = 'none';
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    document.getElementById('clearEmailBtn')?.addEventListener('click', () => emailInput.value = '');
    
    document.getElementById('togglePasswordBtn')?.addEventListener('click', (e) => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      e.target.className = type === 'password' ? 'fa-regular fa-eye-slash right-icon' : 'fa-regular fa-eye right-icon';
    });
  </script>
</body>
</html>
