<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', sans-serif;
        }

        a, span, p, h1, h2, h3, h4, h5, h6, div {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
            text-decoration: none;
        }

        img {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
        }

        :root {
            --text:#000;
            --primary-color: #0075BB;
            --text-dark: #000;
            --text-light: #666;
            --bg-gray: #ffffff;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
            --header-bg: #6aa0ff;
            --controls-bg: #FAF1EB;
            --card-bg: #ffffff;
            --card-border: #f1f5f9;
            --skeleton-base: #ececec;
            --skeleton-shimmer: #f5f5f5;
        }

        /* Dark mode variables */
        body.dark {
            --text:#ffffff;
            --text-dark: #ffffff;
            --text-light: #b0b0b0;
            --bg-gray: #000;
            --white: #1e293b;
            --card-bg: #1e293b;
            --card-border: #334155;
            --header-bg: #6aa0ff;
            --controls-bg: #1e293b;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --skeleton-base: #334155;
            --skeleton-shimmer: #475569;
        }

        body {
            margin: 0;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Header Styles --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            color: #ffffff;
            height: 50px;
            background: #905AF8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header .left .back-btn {
            color: #ffff;
            font-size: 30px;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            padding: 5px;
            border-radius: 50px;
        }

        header .right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dark-toggle, .transaction-btn {
            background: none;
            color: #ffff;
            font-size: 25px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            padding: 5px;
            border-radius: 50px;
        }

        .transaction-btn:hover, .dark-toggle:hover, .left .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Controls Bar */
        .controls {
            background: var(--controls-bg);
            right: 0; width: 100%;         
            padding: 10px 12px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            position: fixed;
            z-index: 999; border-bottom: 1px solid #07789B;
            border-top: 1px solid #07789B;
            transition: background-color 0.3s ease;
            top: 50px;
             }

        .view-btn {
            font-size: 20px;
            color: #ccc;
            cursor: pointer;
            transition: var(--transition);
        }

        .view-btn.active {
            color: var(--primary-color);
        }

        /* --- Main Content Area --- */
        .app-content {
            position: fixed;
            top: 40px;
            bottom: 0;
            width: 100%;
            overflow-y: auto;
            background: var(--bg-gray);
        }

        /* Content Container */
        .course-container {
            padding: 70px 15px 30px; /* Added spacing to avoid controls bar overlapping standard layout */
            display: grid;
            gap: 10px;
            transition: var(--transition);
        }

        /* Default List View Styles */
        .course-container.list-mode {
            grid-template-columns: 1fr;
        }

        /* Grid View Toggle - 2 items per row */
        .course-container.grid-mode {
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* NEW SMOOTH CARD DESIGN */
        .card {
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.09);
            background: var(--card-bg);
            border-radius: 10px;         
            border: 2px solid var(--card-border);
        }

        .image-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
            border-radius: 8px 8px 0 0; 
        }

        .image-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Skeleton Base Styling */
        .card.loading .image-box {
            background: linear-gradient(110deg, var(--skeleton-base) 8%, var(--skeleton-shimmer) 18%, var(--skeleton-base) 33%);
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }

        /* Skeleton Text Styling */
        .card.loading .card-title {
            color: transparent !important;
            background: linear-gradient(110deg, var(--skeleton-base) 8%, var(--skeleton-shimmer) 18%, var(--skeleton-base) 33%);
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
            border-radius: 4px;
            min-height: 40px;
        }

        /* Once images are loaded, show them smoothly */
        .card.loaded .image-box img {
            opacity: 1;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .card-body {
            padding: 10px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }

        /* Adjustments for List Mode specifically */
        .list-mode .card {
            flex-direction: column;
        }

        @media (max-width: 400px) {
            .course-container.grid-mode {
                gap: 12px;
                padding: 70px 10px 30px;
            }
            .card-title { font-size: 14px; font-weight: 800;}
        }

        .hidden { display: none !important; }

        /* No results message */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .no-results i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

   <header>
    <div class="left">
      <button onclick="goBack()" class="back-btn">
        <i data-lucide="arrow-left" class="icon-img"></i>
      </button>
    </div>
    <h3>মাধ্যমিক</h3>
    <div class="right">
      <button id="darkToggle" class="dark-toggle" style="display: none;">🌙</button>
      <div class="controls">
        <i id="listBtn" data-lucide="square" class="view-btn active" onclick="setView('list')"></i>
        <i id="gridBtn" data-lucide="layout-grid" class="view-btn" onclick="setView('grid')"></i>
      </div>
      <a href="https://action_share" class="transaction-btn">
        <i data-lucide="share2" class="icon-img"></i>
      </a>
    </div>
  </header>

 <main class="app-content">
    <main id="courseGrid" class="course-container list-mode">
        
        <!-- Added "loading" class by default to apply skeleton styles -->
        <a href="27/enroll.html" class="card loading" data-course="course1">
            <div class="image-box">
                <img src="https://i.ibb.co/mrh003kQ/class-10.jpg" alt="Course Image" onload="imageLoaded(this)">
            </div>
            <div class="card-body">
                <div class="card-title">Target মাধ্যমিক 2027 (প্র্যাকটিস A+ সাজেশন) বিনামূল্যে ব্যাচ!</div>
            </div>
        </a>
<a href="9/enroll.html" class="card loading" data-course="course1">
            <div class="image-box">
                <img src="https://i.ibb.co/CK78V6m7/Class-09.jpg" alt="Course Image" onload="imageLoaded(this)">
            </div>
            <div class="card-body">
                <div class="card-title">Target Class 9 2026 (প্র্যাকটিস A+ সাজেশন) বিনামূল্যে ব্যাচ!</div>
            </div>
        </a>
       

    </main>
 </main>

    <script>
        function goBack() {
            window.history.back();
        }

        // Lucide icons
        lucide.createIcons();

        const container = document.getElementById('courseGrid');
        const listBtn = document.getElementById('listBtn');
        const gridBtn = document.getElementById('gridBtn');

        // This function handles removal of skeleton placeholders safely once asset loads
        function imageLoaded(imgElement) {
            const card = imgElement.closest('.card');
            if (card) {
                card.classList.remove('loading');
                card.classList.add('loaded');
            }
        }

        // Fallback for cached images that might load instantly before JS triggers
        document.querySelectorAll('.image-box img').forEach(img => {
            if (img.complete) {
                imageLoaded(img);
            }
        });

        function setView(type) {
            if (type === 'grid') {
                container.classList.add('grid-mode');
                container.classList.remove('list-mode');
                gridBtn.classList.add('active');
                listBtn.classList.remove('active');
            } else {
                container.classList.add('list-mode');
                container.classList.remove('grid-mode');
                listBtn.classList.add('active');
                gridBtn.classList.remove('active');
            }
        }

        // ========== DARK MODE TOGGLE ==========
        const darkToggle = document.getElementById("darkToggle");
        const body = document.body;

        if (localStorage.getItem("darkMode") === "true") {
            body.classList.add("dark");
            darkToggle.textContent = "☀️";
        } else {
            darkToggle.textContent = "🌙";
        }

        darkToggle.addEventListener("click", () => {
            body.classList.toggle("dark");
            const isDark = body.classList.contains("dark");
            localStorage.setItem("darkMode", isDark);
            darkToggle.textContent = isDark ? "☀️" : "🌙";
            lucide.createIcons();
        });

        // ========== URL PARAMETER FILTER ==========
        function filterByURL() {
            const params = new URLSearchParams(window.location.search);
            const courseId = params.get('id');
            
            if (!courseId) {
                return;
            }

            const allCards = document.querySelectorAll('.card');
            let found = false;

            allCards.forEach(card => {
                if (card.dataset.course === courseId) {
                    card.style.display = 'flex';
                    found = true;
                } else {
                    card.style.display = 'none';
                }
            });

            if (!found) {
                container.innerHTML = `
                    <div class="no-results">
                        <i data-lucide="search-x"></i>
                        <h3 style="margin-top:16px;font-weight:800;color:var(--text-dark);">Course not found</h3>
                        <p style="margin-top:8px;color:var(--text-light);">No course matches id="${courseId}"</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        window.addEventListener('DOMContentLoaded', filterByURL);
        window.addEventListener('load', filterByURL);
    </script>
</body>
</html>
