<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS 11-12</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <script src="https://unpkg.com/lucide@latest"></script>
  <style>
        /* ===== LIGHT MODE VARIABLES (default) ===== */
       * {
      
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      user-drag: none;
      transition: background 0.3s, color 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    
    a, span, p, h1, h2, h3, h4, h5, h6, div {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      user-drag: none;
      text-decoration: none;
    }
    
    img {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      user-drag: none;
    }
    
        :root {
            --primary-color: #0075BB;
            --text-dark: #333;
            --text-light: #666;
            --bg-gray: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
            --header-bg: #6aa0ff;
            --controls-bg: #F0F4FF;
        }

        /* Dark mode variables */
        body.dark {
            --text-dark: #e0e0e0;
            --text-light: #b0b0b0;
            --bg-gray: #000;
            --white: #2d2d2d;
            --header-bg: #6aa0ff;
            --controls-bg: #2d2d2d;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }
   /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Removes default blue tap highlight */
        }

        body {
            
            margin: 0;
            
            background-color: var(--bg-gray);
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
            
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            color: #ffffff;
            height: 60px;
            background: #3047a5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header .left .back-btn {
            color: #ffff;
            font-size: 30px;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s; padding: 5px;
        }

        header .right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* --- Main Content Area --- */
        .app-content {
            position: fixed;
            top: 60px;
            bottom:0;
            width: 100%;
            overflow-y: auto;
            background-color: var(--bg-gray);
        }
        .dark-toggle, .transaction-btn {
            background: none;
            color: #ffff;
            font-size: 25px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center; padding: 5px;
        }

        .transaction-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
        }

        .dark-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
        }

        .left .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            
        }

        /* Controls Bar */
        .controls {
            background: var(--controls-bg);
            margin-top: 0;
            right: 0;
            border-bottom-left-radius: 15px;
            border-top-left-radius: 15px;
            padding: 10px 10px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            position: fixed;
            z-index: 1000;
            transition: background-color 0.3s ease;
        }

        .view-btn {
            font-size: 20px;
            color: #ccc;
            cursor: pointer;
            transition: var(--transition);
        }

        .view-btn.active {
            color: var(--primary-color);
        }

        /* Content Container */
        .course-container {
            padding: 10px 15px 30px;
            display: grid;
            gap: 20px;
            top: 70px;
            margin-top: 10px;
            transition: var(--transition);
        }

        /* Default List View Styles */
        .course-container.list-mode {
            grid-template-columns: 1fr;
        }

        /* Grid View Toggle - 2 items per row */
        .course-container.grid-mode {
            grid-template-columns: 1fr 1fr;
        }

        /* Smooth Card Design */
        .card {
            overflow: hidden;
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.09);
        }

      
        .image-box {
            position: relative;
            width: 100%;
            height: 100%;
            padding-top: 50.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
        }

        .image-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
            animation: 1.5s shine linear infinite;
        }

        .card-body {
            padding: 2px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-dark);
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .rating {
            color: #ff9800;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 4px;
        }

        /* Adjustments for List Mode specifically */
        .list-mode .card {
            flex-direction: row; /* Optional: set to column if you want big images in list */
            flex-direction: column; 
        }

        @media (max-width: 400px) {
            .course-container.grid-mode {
                gap: 10px;
                padding: 10px;
            }
            .card-title { font-size: 16px; font-weight: 700;}
        }
.hidden{display: none;}
    </style>
</head>
<body>

   <header>
    <div class="left">
      <button onclick="goBack()" class="back-btn">
        <i data-lucide="arrow-left" class="icon-img"></i>
      </button>
    </div>
    <h3>HS 11-12</h3>
    <div class="right">
      <button id="darkToggle" class="dark-toggle hidden">🌙</button>
       <div class="controls">
        <i id="listBtn" data-lucide="square" class="view-btn active" onclick="setView('list')"></i>
        <i id="gridBtn" data-lucide="layout-grid" class="view-btn " onclick="setView('grid')"></i>
    </div><a href="https://action_share" class="transaction-btn">
        <i data-lucide="share2" class="icon-img"></i>
      </a>
    </div>
  </header>
 <main class="app-content">

<a href="#"><img src="https://i.ibb.co/x8cGxqS3/Add-Text-04-14-12-22-36.jpg" style="width: 100%; margin-top: 5px;"></a>
   
    <main id="courseGrid" class="course-container list-mode">
        
        <a href="sem3/enroll.html" class="card">
            <div class="image-box">
                <img src="https://i.ibb.co/k6DX0gfK/Add-Text-03-19-08-32-52.jpg" alt="Course Image">
            </div>
            <div class="card-body">
                <div class="card-title">Class 12 3rd Semester [বাংলা + English] উচ্চমাধ্যমিক তৃতীয় সেমিস্টার</div>
              
            </div>
        </a>

        <a href="sem1/enroll.html" class="card">
            <div class="image-box">
                <img src="https://i.ibb.co/1tmKhVRn/Add-Text-03-19-08-33-27.jpg" alt="Course Image">
            </div>
            <div class="card-body">
                <div class="card-title">Class 11 1st Semester [বাংলা + English] একাদশ প্রথম সেমিস্টার</div>
             
            </div>
        </a>
 
    </main>
 </main>
    <script>
        function goBack() {
            window.history.back();
        }

        // Lucide icons
        lucide.createIcons();

        const container = document.getElementById('courseGrid');
        const listBtn = document.getElementById('listBtn');
        const gridBtn = document.getElementById('gridBtn');

        function setView(type) {
            if (type === 'grid') {
                container.classList.add('grid-mode');
                container.classList.remove('list-mode');
                gridBtn.classList.add('active');
                listBtn.classList.remove('active');
            } else {
                container.classList.add('list-mode');
                container.classList.remove('grid-mode');
                listBtn.classList.add('active');
                gridBtn.classList.remove('active');
            }
        }

        // ========== DARK MODE TOGGLE ==========
        const darkToggle = document.getElementById("darkToggle");
        const body = document.body;

        // Check localStorage for dark mode preference
        if (localStorage.getItem("darkMode") === "true") {
            body.classList.add("dark");
            darkToggle.textContent = "☀️";
        } else {
            darkToggle.textContent = "🌙";
        }

        // Add click event listener
        darkToggle.addEventListener("click", () => {
            body.classList.toggle("dark");
            const isDark = body.classList.contains("dark");
            localStorage.setItem("darkMode", isDark);
            darkToggle.textContent = isDark ? "☀️" : "🌙";
            
            // Recreate icons to ensure they render properly in dark mode (optional)
            lucide.createIcons();
        });
    </script>
</body>
</html>
