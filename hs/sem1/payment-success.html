<script>
const urlParams=new URLSearchParams(location.search);
const course_id=urlParams.get('course_id');
const payment_id=urlParams.get('razorpay_payment_id');
const BACKEND_URL = "create-payment.php";

async function checkPayment(){
    if(payment_id){
        // 3 sec por por check korbe payment hoyeche kina
        let res = await fetch(`${BACKEND_URL}/check-payment.php?pid=${payment_id}`);
        let data = await res.json();
        if(data.status == "paid"){
            localStorage.setItem(`course_unlocked_${course_id}`,"true");
            location.href="details.html";
        } else {
            setTimeout(checkPayment, 3000); // abar check korbe
        }
    }
}
checkPayment();
