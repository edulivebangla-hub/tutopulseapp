<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Course - ₹10</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root {
    --blue: #4f46e5;
    --blue-dark: #4338ca;
    --teal: #0d9488;
    --cream: #ffffff;
    --red: #dc2626;
    --green: #16a34a;
    --gray: #6b7280;
  }
  body { 
    font-family: system-ui, sans-serif; 
    background: linear-gradient(135deg, #e0e7ff 0%, #d1fae5 100%);
    display: flex; align-items: center; justify-content: center; 
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: var(--cream);
    border-radius: 20px;
    padding: 30px 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(79, 70, 229, 0.15);
  }
  h1 { color: #111827; margin: 0 0 8px; font-size: 24px; font-weight: 800; }
  p { color: var(--gray); margin-bottom: 20px; font-size: 14px; }
  .price { font-size: 42px; font-weight: 900; color: var(--teal); margin-bottom: 20px; }
  .price span { font-size: 14px; color: var(--gray); }
  
  .upi-apps {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }
  .upi-apps img {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #f3f4f6;
    padding: 6px;
  }

  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    background: var(--blue);
    color: #fff;
    transition: 0.2s;
  }
  .btn:hover { background: var(--blue-dark); }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn.go { background: var(--green); }
  .note { font-size: 12px; color: var(--gray); margin-top: 12px; }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--green);
    color: #fff;
    padding: 14px 20px;
    border-radius: 10px;
    font-weight: 700;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="card">
  <h1>Unlock Premium Course</h1>
  <p>Get lifetime access to all videos, notes & tests</p>
  <div class="price">₹10 <span>one time</span></div>
  

  
  <button class="btn" id="payBtn">Pay ₹10 & Unlock</button>
  <button class="btn go" id="goBtn" style="display:none;" onclick="goToCourse()">Go To Course</button>
  
  <div class="note">*Secure payment by Razorpay</div>
</div>

<script>
const COURSE_KEY = 'tutoGenius_courseUnlocked_v26';
const COURSE_LINK = "https://www.tutogenius.com/course/premium"; 
const RAZORPAY_KEY = "rzp_live_TB2Tex3fIBoKuX"; // Use rzp_test_xxx for testing

function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 3000);
}

window.onload = () => {
  if (localStorage.getItem(COURSE_KEY) === 'true') {
    showGoButton();
  }
}

function showGoButton() {
  document.getElementById('payBtn').style.display = 'none';
  document.getElementById('goBtn').style.display = 'block';
}

function goToCourse() {
  window.location.href = COURSE_LINK;
}

document.getElementById('payBtn').onclick = function(e) {
  e.preventDefault();
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerText = "Loading...";

  var options = {
      "key": RAZORPAY_KEY,
      "amount": 1000, // 1000 paise = ₹10
      "currency": "INR",
      "name": "TutoGenius",
      "description": "Premium Course Access",
      "image": "https://i.imgur.com/4M34hi2.jpg", 
      
      // THIS IS THE FIX: Force UPI first and enable intent flow
      "method": "upi",
      
      "handler": function (response){
          localStorage.setItem(COURSE_KEY, 'true'); 
          showToast("Payment Successful! Course Unlocked.");
          showGoButton();
          btn.disabled = false;
          btn.innerText = "Pay ₹10 & Unlock";
      },
      "prefill": {
          "name": "",
          "email": "",
          "contact": ""
      },
      "theme": {
          "color": "#4f46e5"
      },
      "modal": {
        "ondismiss": function(){
            showToast("Payment Cancelled", "error");
            btn.disabled = false;
            btn.innerText = "Pay ₹10 & Unlock";
        }
      }
  };
  
  var rzp = new Razorpay(options);
  
  rzp.on('payment.failed', function (response){
        showToast("Payment Failed: " + response.error.description, "error");
        btn.disabled = false;
        btn.innerText = "Pay ₹10 & Unlock";
  });
  
  rzp.open();
}
</script>

</body>
</html>
