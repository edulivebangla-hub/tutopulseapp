<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Course - ₹10</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root {
    --blue: #3b5bdb;
    --teal: #1f8a7a;
    --cream: #fdfae7;
  }
  body { 
    font-family: system-ui, sans-serif; 
    background: linear-gradient(180deg, #fefefe 0%, #f5f6ff 100%);
    display: flex; align-items: center; justify-content: center; 
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: var(--cream);
    border: 3px solid var(--blue);
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  h1 { color: var(--blue); margin-bottom: 8px; }
  p { color: #495057; margin-bottom: 20px; }
  .price { font-size: 32px; font-weight: 700; color: var(--teal); margin-bottom: 20px; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: var(--blue);
    color: #fff;
  }
  .btn:disabled { background: #adb5bd; cursor: not-allowed; }
  .btn.go { background: #2e7d32; }
  .note { font-size: 12px; color: #e03131; margin-top: 12px; }
</style>
</head>
<body>

<div class="card">
  <h1>Unlock Premium Course</h1>
  <p>Get lifetime access to all videos, notes & tests</p>
  <div class="price">₹10</div>
  
  <button class="btn" id="payBtn">Pay ₹10 & Unlock</button>
  <button class="btn go" id="goBtn" style="display:none;" onclick="goToCourse()">Go To Course</button>
  
  <div class="note">*One time payment only. Access will be saved on this device/browser.</div>
</div>

<script>
const COURSE_KEY = 'tutoGenius_courseUnlocked_v2';
const COURSE_LINK = "https://www.tutogenius.com/course/premium"; // <-- change this to your course link

// Check if already paid
window.onload = () => {
  if (localStorage.getItem(COURSE_KEY) === 'true') {
    showGoButton();
  }
}

function showGoButton() {
  document.getElementById('payBtn').style.display = 'none';
  document.getElementById('goBtn').style.display = 'block';
}

function goToCourse() {
  window.location.href = COURSE_LINK;
}

// Razorpay Payment
document.getElementById('payBtn').onclick = function(e) {
  var options = {
      "key": "rzp_live_TB1pPShucn7fJw", // USE TEST KEY HERE. Replace with server-generated order
      "amount": 1000, // 1000 paise = ₹10
      "currency": "INR",
      "name": "TutoGenius",
      "description": "Premium Course Access",
      "image": "https://i.imgur.com/4M34hi2.jpg", // your logo
      "handler": function (response){
          // Payment Success
          // TODO: Send response.razorpay_payment_id to your server to verify
          localStorage.setItem(COURSE_KEY, 'true'); // Save that user paid
          alert("Payment Successful! Course Unlocked.");
          showGoButton();
      },
      "prefill": {
          "name": "",
          "email": ""
      },
      "theme": {
          "color": "#3b5bdb"
      }
  };
  var rzp = new Razorpay(options);
  rzp.open();
  e.preventDefault();
}
</script>

</body>
</html>
