<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
 * {box-sizing: border-box;-webkit-user-select: none;transition: background 0.3s, color 0.3s;-webkit-tap-highlight-color: transparent;}
    :root {--primary-color: #0555E8;--text-dark: #1e293b;--text-muted: #64748b;--bg-light: #fff;--card-bg: #ffffff;--shimmer-start: #e2e8f0;--shimmer-mid: #f1f5f9;}
    body.dark {--text-dark: #f1f5f9;--text-muted: #94a3b8;--bg-light: #0f172a;--card-bg: #1e293b;--shimmer-start: #1e293b;--shimmer-mid: #334155;}
    body {font-family: 'Inter', 'Hind Siliguri', sans-serif;background-color: var(--bg-light);color: var(--text-dark);display: flex;justify-content: center;}
    .app-container {position: fixed;top: 0px;bottom: 60px;width: 100%;overflow-y: auto;background: var(--bg-light);}
    .top-navbar {position: fixed;top: 0;left: 0;width: 100%;height: 50px;background: #0555E8;display: flex;align-items: center;justify-content: space-between;padding: 0 16px;z-index: 1000;}
    .nav-btn {background: none;border: none;color: #ffffff;cursor: pointer;width: 40px;height: 40px;display: flex;align-items: center;justify-content: center;}
    .coin-balance {display: flex;align-items: center;gap: 2px;font-weight: 700;color: #d97706;background: #fef3c7;padding: 1px 10px;border-radius: 10px;}
    .content-scroll {padding: 60px 20px 30px 20px;}
    .media-frame {width: 100%;border-radius: 10px;overflow: hidden;aspect-ratio: 16 / 9;background-color: var(--shimmer-start);}
    .media-frame img {width: 100%;height: 100%;object-fit: cover;opacity: 0;transition: opacity 0.5s;}
    .media-frame.loaded img {opacity: 1;}
    .skeleton-shimmer {position: absolute;top: 0;left: 0;width: 100%;height: 100%;background: linear-gradient(90deg, var(--shimmer-start) 25%, var(--shimmer-mid) 50%, var(--shimmer-start) 75%);background-size: 200% 100%;animation: shimmerLinear 1.6s infinite;}
    .media-frame.loaded .skeleton-shimmer {display: none;}
    @keyframes shimmerLinear {0% { background-position: 200% 0; }100% { background-position: -200% 0; }}
    .course-title {font-size: 20px;font-weight: 700;margin-top: 20px;}
    .course-description {font-size: 15px;color: var(--text-muted);margin-bottom: 24px;}
    .action-dock {position: fixed;bottom: 0;width: 100%;max-width: 480px;background: var(--card-bg);padding: 16px 20px;display: grid;grid-template-columns: 85px 1fr;gap: 12px;border-top: 1px solid var(--shimmer-start);z-index: 10;}
    .badge-free {border: 1px solid var(--text-muted);color: #07789B;border-radius: 24px;height: 30px;display: flex;align-items: center;justify-content: center;font-weight: 700;font-size: 18px;}
    .btn-action-trigger {background-color: var(--primary-color);color: #ffffff;border: none;border-radius: 24px;height: 48px;font-size: 18px;font-weight: 600;width: 100%;position: relative;}
    .loader-dots-element {display: none;align-items: center;gap: 6px;justify-content: center;position: absolute;inset: 0;background: inherit;}
    .loader-dots-element span {width: 8px;height: 8px;background-color: #ffffff;border-radius: 50%;display: inline-block;animation: dotElasticity 1.4s infinite ease-in-out both;}
    .loader-dots-element span:nth-child(1) { animation-delay: -0.32s; }
    .loader-dots-element span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dotElasticity {0%, 80%, 100% { transform: scale(0); }40% { transform: scale(1.0); }}
    .toast-notification-hub {position: fixed;top: 80px;left: 50%;transform: translateX(-50%);width: calc(100% - 40px);z-index: 200;}
    .custom-toast {background: #1e293b;color: #ffffff;padding: 12px 16px;border-radius: 10px;font-size: 14px;display: flex;align-items: center;gap: 10px;transform: translateY(-20px);opacity: 0;transition: all 0.3s;}
    .custom-toast.reveal {transform: translateY(0);opacity: 1;}
    .custom-toast.toast-success {background: #16a34a;}
    .custom-toast.toast-error {background: #dc2626;}
    </style>
</head>
<body>

    <div class="app-container">
        <div class="toast-notification-hub" id="toastHub"></div>

        <header class="top-navbar">
            <button class="nav-btn" onclick="goBack()"><i data-lucide="x"></i></button>
            <div class="coin-balance">₹<span id="balance">0</span></div>
            <button class="nav-btn" id="darkToggle">🌙</button>
        </header>

        <main class="content-scroll">
            <div class="media-frame" id="bannerFrame">
                <div class="skeleton-shimmer"></div>
                <img src="https://i.ibb.co/nN1kVj31/class-12.jpg" alt="Class 12" id="courseImage" onload="document.getElementById('bannerFrame').classList.add('loaded')">
            </div>

            <h1 class="course-title">Class 12 3rd Semester [বাংলা + English] উচ্চমাধ্যমিক তৃতীয় সেমিস্টার!</h1>
            <p class="course-description">নতুন সেমিস্টার সিস্টেমে পড়ুয়াদের জন্য পড়াশোনা, সাজেশন ও ভিডিও ক্লাস!</p>
        </main>

        <footer class="action-dock">
            <div class="badge-free">₹99</div> 
            <button class="btn-action-trigger" id="masterActionButton" onclick="handleEnrollmentWorkflow()">
                <span id="buttonTextLabel">Enroll Now</span>
                <div class="loader-dots-element" id="dockButtonLoader">
                    <span></span><span></span><span></span>
                </div>
            </button>
        </footer>
    </div>

    <script>
        function goBack() {window.history.back();}

        const COURSE_ID = "c12_sem378"; 
        const COURSE_PRICE = 1;
        const REDIRECT_URL = "subject.html";
        const RAZORPAY_KEY = "rzp_live_TI1dFwgtX10E02";
        // IMPORTANT: TOMAR GITHUB LINK TA EKHAENE BOSAO
        const SUCCESS_CALLBACK_URL = "payment-success.html" + COURSE_ID;

        let currentBalance = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initDarkModePreference();
            loadBalance();
            evaluateEnrollmentLockState();
            lucide.createIcons();
        });

        function loadBalance() {
            currentBalance = parseInt(localStorage.getItem("coinBalance")) || 0;
            document.getElementById("balance").innerText = currentBalance;
        }

        const darkToggle = document.getElementById("darkToggle");
        function initDarkModePreference() {
            if (localStorage.getItem("darkMode") === "true") {
                document.body.classList.add("dark"); darkToggle.textContent = "☀️";
            } else {darkToggle.textContent = "🌙";}
        }
        darkToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const isDark = document.body.classList.contains("dark");
            localStorage.setItem("darkMode", isDark);
            darkToggle.textContent = isDark ? "☀️" : "🌙";
        });

        function dispatchToast(textAlert, mode = "error") {
            const hub = document.getElementById("toastHub");
            const toast = document.createElement("div");
            toast.className = `custom-toast toast-${mode}`;
            toast.innerHTML = `<span>${textAlert}</span>`;
            hub.appendChild(toast);
            setTimeout(() => toast.classList.add("reveal"), 50);
            setTimeout(() => {toast.classList.remove("reveal");setTimeout(() => toast.remove(), 300);}, 3000);
        }

        function evaluateEnrollmentLockState() {
            const isUnlocked = localStorage.getItem(`course_unlocked_${COURSE_ID}`);
            document.getElementById("buttonTextLabel").innerText = (isUnlocked === "true") ? "Start Course" : "Enroll Now";
        }

        // MAIN RAZORPAY PAYMENT FUNCTION
        async function handleEnrollmentWorkflow() {
            const isUnlocked = localStorage.getItem(`course_unlocked_${COURSE_ID}`);
            const loader = document.getElementById("dockButtonLoader");
            const textLabel = document.getElementById("buttonTextLabel");

            if (isUnlocked === "true") {
                window.location.href = REDIRECT_URL;
                return;
            }

            textLabel.style.opacity = "0";
            loader.style.display = "flex";

            try {
                // Create Payment Link using Razorpay API
                const response = await fetch("https://api.razorpay.com/v1/payment_links", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Basic " + btoa(RAZORPAY_KEY + ":") // Live key
                    },
                    body: JSON.stringify({
                        "amount": COURSE_PRICE * 100,
                        "currency": "INR",
                        "description": "Class 12 3rd Semester Course",
                        "customer": {"name": "Student", "email": "student@tutogenius.sbs", "contact": "9332466756"},
                        "notify": {"sms": false, "email": false},
                        "callback_url": SUCCESS_CALLBACK_URL,
                        "callback_method": "get"
                    })
                });

                const data = await response.json();
                
                if(data.short_url){
                    // Send user to Razorpay Payment Page
                    window.location.href = data.short_url; 
                } else {
                    throw new Error(data.error?.description || "Payment Link Failed");
                }

            } catch (error) {
                dispatchToast("Error: " + error.message, "error");
                textLabel.style.opacity = "1";
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
