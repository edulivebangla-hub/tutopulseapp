<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Details</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>/* ager motoi css */ *{box-sizing:border-box}body{font-family:sans-serif;background:#fff;display:flex;justify-content:center}.app-container{position:fixed;top:0;bottom:60px;width:100%;overflow-y:auto}.top-navbar{position:fixed;top:0;width:100%;height:50px;background:#0555E8;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff}.coin-balance{background:#fef3c7;color:#d97706;padding:1px 10px;border-radius:10px;font-weight:700}.content-scroll{padding:60px 20px}.media-frame img{width:100%;border-radius:10px}.action-dock{position:fixed;bottom:0;width:100%;padding:16px;display:grid;grid-template-columns:85px 1fr;gap:12px;background:#fff;border-top:1px solid #ddd}.badge-free{border:1px solid #64748b;color:#07789B;border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:700}.btn-action-trigger{background:#0555E8;color:#fff;border:none;border-radius:24px;height:48px;font-size:18px;font-weight:600}</style>
</head>
<body>
<div class="app-container">
<header class="top-navbar"><button onclick="history.back()">X</button><div class="coin-balance">₹<span id="balance">0</span></div><button id="darkToggle">🌙</button></header>
<main class="content-scroll">
<img src="https://i.ibb.co/nN1kVj31/class-12.jpg" class="media-frame">
<h1>Class 12 3rd Semester [বাংলা + English]</h1>
<p>নতুন সেমিস্টার সিস্টেমে পড়ুয়াদের জন্য</p>
</main>
<footer class="action-dock"><div class="badge-free">₹99</div><button class="btn-action-trigger" id="masterActionButton" onclick="handleEnrollmentWorkflow()"><span id="buttonTextLabel">Enroll Now</span></button></footer>
</div>

<script>
const COURSE_ID="c12_sem378";
const REDIRECT_URL="subject.html";
const PAYMENT_LINK="https://rzp.io/rzp/VdFshzl"; // <-- EKHANE TOMAR LINK BOSAO

document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById("balance").innerText=localStorage.getItem("coinBalance")||0;
    document.getElementById("buttonTextLabel").innerText=localStorage.getItem(`course_unlocked_${COURSE_ID}`)==="true"?"Start Course":"Enroll Now";
});

function handleEnrollmentWorkflow(){
    if(localStorage.getItem(`course_unlocked_${COURSE_ID}`)==="true"){
        location.href=REDIRECT_URL;return
    }
    // Sudhu Payment Link e pathiye debo
    window.location.href = PAYMENT_LINK; 
}
</script>
</body>
</html>
