<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments - TutoGenius</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root { --primary: #FFD60A; --accent: #1e40af; --bg: #fff; --text-main: #0f172a; }
*{margin:0;padding:0;box-sizing:border-box;font-family: sans-serif;}
body{background:var(--bg);display:flex;justify-content:center;}
.app-wrapper {width: 100%;max-width: 480px;min-height: 100vh;}
.header{display:flex;align-items:center;padding:12px 20px;background:#0555E8;color:#fff;}
.header h1{font-size: 19px; font-weight: 700; margin-left:14px;}
.container{padding:18px;}
.wallet-card {background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);color: #fff; border-radius:16px; padding:20px;}
.balance{font-size: 32px; font-weight: 800; margin: 12px 0 16px;}
.add-money-btn{border:none; padding:12px 18px; border-radius:30px; display:inline-flex; align-items:center; gap:8px;
  font-size: 14px; font-weight: 700; cursor:pointer; background: var(--primary); color: #000; width:100%; justify-content:center;}
.amount-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.amount-btn{border:2px solid #e2e8f0;background:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.pay-btn {width: 100%; background: var(--primary); color: #000; border: none; padding: 16px;border-radius: 12px; font-size: 16px; font-weight: 700;}
.toast {position: fixed;bottom: 20px;left: 50%;transform: translateX(-50%);background: #0f172a;color: #fff;padding: 14px 18px;border-radius: 12px;display: none;}
.toast.show{display:block}
</style>
</head>
<body>

<div class="app-wrapper">
  <header class="header">
    <i data-lucide="arrow-left" onclick="window.history.back()"></i>
    <h1>Payments</h1>
  </header>
  <div class="container">
    <div class="wallet-card">
      <div>TutoGenius Wallet</div>
      <div class="balance">₹<span id="balance">0</span></div>
    </div>

    <h3 style="margin:20px 0 10px">Add Money</h3>
    <div class="amount-grid">
      <button class="amount-btn" onclick="payWithLink(50)">₹50</button>
      <button class="amount-btn" onclick="payWithLink(100)">₹100</button>
      <button class="amount-btn" onclick="payWithLink(200)">₹200</button>
      <button class="amount-btn" onclick="payWithLink(500)">₹500</button>
    </div>
    <input type="number" id="customAmount" placeholder="Custom Amount" style="width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:12px;margin-bottom:12px">
    <button class="pay-btn" onclick="payWithLink(document.getElementById('customAmount').value)">Pay Now</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
lucide.createIcons();

// 1. EKHANE TOMAR RAZORPAY PAYMENT LINK GULO BOSHAO
const PAYMENT_LINKS = {
  50: "https://rzp.io/rzp/ciTAQ01", // Dashboard > Payment Links > Create Link for 50
 100: "https://rzp.io/l/TG100", // Dashboard > Payment Links > Create Link for 100
  200: "https://rzp.io/l/TG200",
  500: "https://rzp.io/l/TG500"
};

// 2. BALANCE SYSTEM
let balance = parseInt(localStorage.getItem('coinBalance') || '0');
document.getElementById('balance').textContent = balance;

function addCoins(amount) {
  balance += parseInt(amount);
  localStorage.setItem('coinBalance', balance);
  document.getElementById('balance').textContent = balance;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// 3. PAYMENT FUNCTION
function payWithLink(amount){
  amount = parseInt(amount);
  if(amount < 50){ showToast("Minimum ₹50"); return; }

  // Jodi ready-made link thake
  if(PAYMENT_LINKS[amount]){
    window.open(PAYMENT_LINKS[amount], "_system"); // APK te browser e khulbe
    // Payment korar por user ke app e back ashe balance add korar jonno
    setTimeout(()=>{
      addCoins(amount);
      showToast(`✅ ₹${amount} Added!`);
    }, 5000); // 5 sec por auto add. Chaile "I have paid" button dite pari
  } else {
    // Custom amount er jonno
    alert("Please create a Payment Link for ₹" + amount + " in Razorpay Dashboard");
  }
}

// App open howar somoy check korbe payment success kina
window.onload = function(){
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('payment') === 'success'){
    let amt = urlParams.get('amount');
    addCoins(amt);
    showToast(`✅ ₹${amt} Added Successfully!`);
  }
}
</script>
</body>
</html>
