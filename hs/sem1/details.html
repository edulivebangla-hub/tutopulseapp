<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Details</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:sans-serif;background:#fff;margin:0;padding-bottom:80px}
.top-navbar{position:fixed;top:0;width:100%;height:50px;background:#0555E8;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;z-index:10}
.coin-balance{background:#fef3c7;color:#d97706;padding:2px 10px;border-radius:10px;font-weight:700}
.content{padding:70px 20px 20px}
.media-frame img{width:100%;border-radius:10px}
.action-dock{position:fixed;bottom:0;width:100%;padding:16px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:85px 1fr;gap:12px}
.badge-free{border:1px solid #64748b;color:#07789B;border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.btn-action-trigger{background:#0555E8;color:#fff;border:none;border-radius:24px;height:48px;font-size:18px;font-weight:600;width:100%}

/* QR Modal */
.qr-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:center;justify-content:center}
.qr-box{background:#fff;padding:24px;border-radius:16px;text-align:center;width:90%;max-width:350px}
#qrcode{display:flex;justify-content:center;margin:16px 0}
.btn-verify{background:#16a34a;color:#fff;border:none;padding:12px 20px;border-radius:24px;font-weight:600;width:100%;margin-top:10px}
</style>
</head>
<body>
<header class="top-navbar"><button onclick="history.back()">X</button><div class="coin-balance">₹<span id="balance">0</span></div></header>

<main class="content">
<img src="https://i.ibb.co/nN1kVj31/class-12.jpg" class="media-frame">
<h1 style="font-size:20px;font-weight:700;margin-top:16px">Class 12 3rd Semester [বাংলা + English]</h1>
<p style="color:#64748b">নতুন সেমিস্টার সিস্টেমে পড়ুয়াদের জন্য পড়াশোনা, সাজেশন ও ভিডিও ক্লাস!</p>
</main>

<footer class="action-dock">
    <div class="badge-free">₹99</div>
    <button class="btn-action-trigger" id="masterActionButton" onclick="handleEnrollmentWorkflow()">Enroll Now</button>
</footer>

<!-- QR MODAL -->
<div class="qr-modal" id="qrModal">
    <div class="qr-box">
        <h2 style="font-weight:700">Scan & Pay ₹99</h2>
        <p style="font-size:13px;color:#64748b">Razorpay QR - GPay, PhonePe, Paytm</p>
        <div id="qrcode"></div>
        <p style="font-size:12px">QR ID: <b>qr_THzvlF0kWqMd4B</b></p>
        <button class="btn-verify" onclick="verifyPayment()">I Have Paid</button>
        <button style="margin-top:8px;background:none;border:none;color:#64748b" onclick="closeQR()">Cancel</button>
    </div>
</div>

<script>
const COURSE_ID="c12_sem378";
const COURSE_PRICE=99;
const REDIRECT_URL="subject.html";
const RAZORPAY_QR_ID = "qr_THzvlF0kWqMd4B"; // TOMAR QR ID

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("balance").innerText=localStorage.getItem("coinBalance")||0;
    if(localStorage.getItem(`course_unlocked_${COURSE_ID}`)==="true"){
        document.getElementById("masterActionButton").innerText="Start Course";
    }
    lucide.createIcons();
});

function handleEnrollmentWorkflow() {
    if(localStorage.getItem(`course_unlocked_${COURSE_ID}`)==="true"){
        location.href=REDIRECT_URL;
        return;
    }
    showQR();
}

function showQR(){
    document.getElementById("qrModal").style.display="flex";
    document.getElementById("qrcode").innerHTML="";
    
    // Razorpay QR Link format
    const razorpayQRLink = `https://rzp.io/i/${RAZORPAY_QR_ID}`;
    
    new QRCode(document.getElementById("qrcode"), {
        text: razorpayQRLink,
        width: 200,
        height: 200
    });
}

function closeQR(){
    document.getElementById("qrModal").style.display="none";
}

function verifyPayment(){
    const txnId = prompt("Payment korechen? Razorpay Payment ID ba UTR din:");
    if(txnId && txnId.length >= 4){
        localStorage.setItem(`course_unlocked_${COURSE_ID}`, "true");
        localStorage.setItem(`txn_${COURSE_ID}`, txnId);
        alert("✅ Payment Submitted! Course Unlocked");
        location.href=REDIRECT_URL;
    } else {
        alert("❌ Please enter Payment ID");
    }
}
</script>
</body>
</html>
