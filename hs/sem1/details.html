<script>
const COURSE_ID="c12_sem378";
const REDIRECT_URL="subject.html";
const BACKEND_URL = "create-payment.php"; // PHP file er link

async function handleEnrollmentWorkflow() {
    if(localStorage.getItem(`course_unlocked_${COURSE_ID}`)==="true"){
        location.href=REDIRECT_URL; return;
    }

    document.getElementById("buttonTextLabel").innerText="Loading...";
    
    // 1. Backend theke Payment Link banabo
    const formData = new FormData();
    formData.append('course_id', COURSE_ID);

    const res = await fetch(`${BACKEND_URL}/create-payment.php`, {method: 'POST', body: formData});
    const data = await res.json();
    
    if(data.short_url){
        // 2. User ke payment e pathabo
        localStorage.setItem("pending_payment_course", COURSE_ID); // mone rakhlam
        window.location.href = data.short_url;
    } else {
        alert("Error: "+data.error.description);
    }
}
</script>
