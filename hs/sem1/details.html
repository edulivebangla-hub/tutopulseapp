<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Payments - TutoGenius</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root {
  --primary: #FFD60A; --accent: #1e40af; --bg: #fff; --text-main: #0f172a; --text-muted: #64748b;
  --radius: 16px; --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
}
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;}
body{background:var(--bg);display:flex;justify-content:center;min-height:100vh;}
.app-wrapper {width: 100%;max-width: 480px;background: var(--bg);min-height: 100vh;}

.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#0555E8;color:#fff;position:sticky;top:0;z-index:10;}
.header h1{font-size: 19px; font-weight: 700;}

.container{padding:18px;}
.wallet-card {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #fff; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);
}
.balance{font-size: 32px; font-weight: 800; margin: 12px 0 16px;}
.add-money-btn{
  border:none; padding:12px 18px; border-radius:30px; display:inline-flex; align-items:center; gap:8px; 
  font-size: 14px; font-weight: 700; cursor:pointer; background: var(--primary); color: #000; width:100%; justify-content:center;
}

.addmoney-page{display:none;position:fixed;inset:0;background:#fff;z-index:100;flex-direction:column; max-width: 480px; margin: 0 auto;}
.addmoney-page.show{display:flex;}
.addmoney-header{background: #0555E8;padding:16px 20px;color: #fff;display:flex;align-items:center;gap:14px;}
.addmoney-header i{width:22px;height:22px;cursor:pointer;}
.addmoney-content{padding:24px 20px;flex:1;}
.amount-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.amount-btn{border:2px solid #e2e8f0;background:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.amount-btn.active{border-color:#0555E8;background:#eff6ff;color:#0555E8}
.custom-amount-input {width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px;font-size: 15px; font-weight: 700; margin-bottom: 12px;}
.pay-btn {width: 100%; background: var(--primary); color: #000; border: none; padding: 16px;border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;}

.custom-toast {position: fixed;bottom: 20px;left: 50%;transform: translateX(-50%) translateY(100px);width: calc(100% - 40px);max-width: 440px;
  background: #0f172a;color: #fff;padding: 16px 20px;border-radius: 14px;display: flex;align-items: center;gap: 12px;z-index: 300;
  transition: transform 0.3s ease, opacity 0.3s ease;opacity: 0;}
.custom-toast.show {transform: translateX(-50%) translateY(0);opacity: 1;}
.custom-toast.success i { color: #4ade80; }
.custom-toast.error i { color: #f87171; }
</style>
</head>
<body>

<div class="app-wrapper">
  <!-- MAIN PAGE -->
  <div id="mainPage">
    <header class="header">
      <i data-lucide="arrow-left" onclick="window.history.back()"></i>
      <h1>Payments</h1>
      <div></div>
    </header>
    <div class="container">
      <div class="wallet-card">
        <div>TutoGenius Wallet</div>
        <div class="balance">₹<span id="balance">0</span></div>
        <button class="add-money-btn" onclick="openAddMoney()">
          <i data-lucide="plus"></i> Add Money
        </button>
      </div>
    </div>
  </div>

  <!-- ADD MONEY PAGE -->
  <div class="addmoney-page" id="addMoneyPage">
    <div class="addmoney-header">
      <i data-lucide="arrow-left" onclick="closeAddMoney()"></i>
      <h2>Add Money</h2>
    </div>
    <div class="addmoney-content">
      <h3 style="margin-bottom:12px">Select Amount</h3>
      <div class="amount-grid">
        <button class="amount-btn" onclick="selectAmount(50,this)">₹50</button>
        <button class="amount-btn" onclick="selectAmount(100,this)">₹100</button>
        <button class="amount-btn" onclick="selectAmount(200,this)">₹200</button>
        <button class="amount-btn" onclick="selectAmount(500,this)">₹500</button>
      </div>
      <input type="number" id="customAmount" class="custom-amount-input" placeholder="Or Enter Custom Amount" min="50">
      <button class="pay-btn" id="payBtn" onclick="payNow()">
        <i data-lucide="credit-card"></i> Pay ₹<span id="payAmount">100</span>
      </button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="custom-toast" id="customToast">
    <i data-lucide="info" id="toastIcon"></i>
    <div id="toastMsg">Notification</div>
  </div>
</div>

<script>
lucide.createIcons();

const RAZORPAY_KEY = "rzp_live_TI1dFwgtX10E02"; // TOMAR LIVE KEY
let selectedAmount = 100;

// --- BALANCE ---
let balance = parseInt(localStorage.getItem('coinBalance') || '0');
const balanceEl = document.getElementById('balance');
function updateBalanceUI(){ balanceEl.textContent = balance; }
updateBalanceUI();

function addCoins(amount) {
  balance += parseInt(amount);
  localStorage.setItem('coinBalance', balance);
  updateBalanceUI();
}

// --- TOAST ---
function showToast(msg, type = 'success') {
  const toast = document.getElementById('customToast');
  const toastMsg = document.getElementById('toastMsg');
  const toastIcon = document.getElementById('toastIcon');
  toast.className = `custom-toast ${type} show`;
  toastMsg.textContent = msg;
  toastIcon.setAttribute('data-lucide', type==='success' ? 'check-circle-2' : 'alert-circle');
  lucide.createIcons();
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

// --- UI ---
function openAddMoney(){ document.getElementById('addMoneyPage').classList.add('show'); }
function closeAddMoney(){ document.getElementById('addMoneyPage').classList.remove('show'); }

function selectAmount(amt, el){
  selectedAmount = amt;
  document.querySelectorAll('.amount-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('customAmount').value = '';
  document.getElementById('payAmount').innerText = amt;
}

document.getElementById('customAmount').addEventListener('input', function(){
  selectedAmount = parseInt(this.value) || 0;
  document.getElementById('payAmount').innerText = selectedAmount;
  document.querySelectorAll('.amount-btn').forEach(b=>b.classList.remove('active'));
});

// --- RAZORPAY CHECKOUT ---
function payNow(){
  let amount = parseInt(document.getElementById('customAmount').value) || selectedAmount;
  
  if(amount < 50){ // Live e 50 er niche problem
    showToast("Minimum ₹50 add korte hobe", 'error');
    return;
  }

  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerText = 'Processing...';

  const options = {
    "key": RAZORPAY_KEY,
    "amount": amount * 100, // Paisa
    "currency": "INR",
    "name": "TutoGenius",
    "description": "Wallet Recharge",
    "image": "https://i.ibb.co/nN1kVj31/class-12.jpg",
    "handler": function (response){
      // SUCCESS
      addCoins(amount);
      showToast(`✅ ₹${amount} added successfully!`, 'success');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="credit-card"></i> Pay ₹<span id="payAmount">'+selectedAmount+'</span>';
      lucide.createIcons();
      closeAddMoney();
    },
    "prefill": { "name": "TutoGenius User", "email": "user@tutogenius.com", "contact": "9000000000" },
    "theme": { "color": "#0555E8" },
    "modal": {
      "ondismiss": function(){
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="credit-card"></i> Pay ₹<span id="payAmount">'+selectedAmount+'</span>';
        lucide.createIcons();
        showToast("Payment Cancelled", 'error');
      }
    }
  };
  
  const rzp = new Razorpay(options);
  rzp.on('payment.failed', function (response){
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="credit-card"></i> Pay ₹<span id="payAmount">'+selectedAmount+'</span>';
    lucide.createIcons();
    showToast("Payment Failed: " + response.error.description, 'error');
  });
  rzp.open();
}
</script>
</body>
</html>
