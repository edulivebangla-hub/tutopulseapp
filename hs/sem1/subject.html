<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 12 3rd Semester [বাংলা + English] উচ্চমাধ্যমিক তৃতীয় সেমিস্টার</title>
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
* {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      user-drag: none;
      transition: background 0.3s, color 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    
    a, span, p, h1, h2, h3, h4, h5, h6, div {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      user-drag: none;
      text-decoration: none;
    }
    
    img {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      user-drag: none;
      
    }
        :root {
            --bg-color: #f8fafc;
            --header-bg: #2d42a7;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --accent-blue: #4472f1;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        /* Dark Mode Colors */
        body.dark {
            --bg-color: #121212;
            --header-bg: #1a1a1a;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-color);
        }

        /* Header Styles */
        .header {
            position: fixed;
            top: 0;
            left: 0; gap: 15px;
            width: 100%;
            color: #ffffff;
            height: 50px;
         background: #905AF8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .header-content {
            flex-grow: 1;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
        }

        #darkToggle {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
  .app-content {
            position: fixed;
            top: 50px;
            bottom: 0px;
            width: 100%;
            overflow-y: auto;
            background: var(--bg-surface);
            transition: background-color 0.3s;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .app-content::-webkit-scrollbar {
            display: none;
            width: 0;
            background: transparent;
        }
        /* List Styles */
        .list-container {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            transform: translateY(0);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:active {
            transform: scale(0.99);
        }

        .badge-num {
            background-color: var(--accent-blue);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .card-text {
            flex-grow: 1;
            font-weight: 600;
            font-size: 16px;
            color: var(--text-primary);
        }

        .chevron-icon {
            color: #ccc;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <i data-lucide="x" onclick="goBack()"></i>
        <div class="header-content">
            Class 11 1st Semester [বাংলা + English] একাদশ প্রথম সেমিস্টার
        </div>
        <button style="display: none;" id="darkToggle" title="Toggle Dark Mode">
            <i data-lucide="moon"></i>
        </button>
    </header>
<main class="app-content">
    <div class="list-container">
        <!-- Item 1 -->
        <a href="https://wa.me/yourlink" class="card-link">
            <div class="card">
                <div class="badge-num">1</div>
                <div class="card-text">🎯 Free বই স্টাডি রিসোর্স + ✅ WhatsApp Group [Special]</div>
                <i data-lucide="chevron-right" class="chevron-icon"></i>
            </div>
        </a>

       

        <!-- Item 2 -->
        <a href="bangla/cheptar.html" class="card-link">
            <div class="card">
                <div class="badge-num">2</div>
                <div class="card-text">Bangla ( বাংলা ) - Notes</div>
                <i data-lucide="chevron-right" class="chevron-icon"></i>
            </div>
        </a>

        
    </div>
</div>
</main>
<script>
function goBack() {
            window.history.back();
        }
    // Initialize Lucide Icons
    lucide.createIcons();

    // Dark Mode Toggle Logic
    const darkToggle = document.getElementById('darkToggle');
    const body = document.body;

    // Check Local Storage on Load
    if(localStorage.getItem('darkMode') === 'true') {
        body.classList.add('dark');
        updateToggleIcon();
    }

    function updateToggleIcon() {
        const isDark = body.classList.contains('dark');
        const iconElem = darkToggle.querySelector('i');
        if(iconElem) {
            const iconName = isDark ? 'sun' : 'moon';
            // We replace the icon by updating the attribute and re-triggering Lucide
            iconElem.setAttribute('data-lucide', iconName);
            lucide.createIcons(); 
        }
    }

    darkToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        localStorage.setItem('darkMode', body.classList.contains('dark'));
        updateToggleIcon();
        
        // Swiper check (from your snippet)
        if(window.swiperInstance) window.swiperInstance.update();
    });
</script>

</body>
</html>
