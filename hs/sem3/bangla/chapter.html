<body>

  <header class="app-header">
    <button class="close-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <h1 class="header-title">Bangla ( বাংলা ) - Notes</h1>
    <!-- ID 'darkToggle' added here to match your script -->
    <button style="display: none;"class="theme-toggle" id="darkToggle"><i data-lucide="moon"></i></button>
  </header>

  <main class="app-content">
    <div class="subject-list" id="subjectList"></div>
  </main>

  <div class="sheet-backdrop" id="backdrop" onclick="history.back()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-header">
      <div class="drag-handle"></div>
      <div style="flex: 1"></div>
      <button class="sheet-close-icon" onclick="history.back()"><i data-lucide="x"></i></button>
    </div>
    <div class="sheet-content" id="sheetContent"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>

  <div class="viewer" id="viewer">
    <button class="close-btn-viewer" onclick="history.back()"><i data-lucide="x"></i></button>
    <img id="viewerImg" draggable="false">
  </div>

  <script>
  

    // --- DARK MODE LOGIC ---
    const darkToggle = document.getElementById('darkToggle');
    const body = document.body;

    // Check saved preference
    if(localStorage.getItem('darkMode') === 'true') {
        body.classList.add('dark');
    }

    function updateToggleIcon() {
        const isDark = body.classList.contains('dark');
        const iconElem = darkToggle.querySelector('i');
        if(iconElem) {
            const iconName = isDark ? 'sun' : 'moon';
            iconElem.setAttribute('data-lucide', iconName);
            // Refresh only the toggle icon
            lucide.createIcons({
                icons: { [iconName]: iconElem }
            });
        }
    }

    darkToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        localStorage.setItem('darkMode', body.classList.contains('dark'));
        updateToggleIcon();
    });

    // Initial icon setup
    updateToggleIcon();
    lucide.createIcons();

  
    let completedLessonNames = JSON.parse(localStorage.getItem('completedLessonNames')) || [];

    function renderList() {
      const subjectList = document.getElementById('subjectList');
      subjectList.innerHTML = '';
      subjects.forEach(sub => {
        const isDone = completedLessonNames.includes(sub.name);
        const item = document.createElement('div');
        item.className = `subject-item ${isDone ? 'completed' : ''}`;
        item.onclick = () => openSheet(sub);
        item.innerHTML = `
          <div class="subject-num">${sub.id}</div>
          <div class="subject-name">${sub.name}</div>
          <i data-lucide="check-circle-2" class="status-icon"></i>
          <i data-lucide="sticker" class="subject-arrow"></i>
        `;
        subjectList.appendChild(item);
      });
      lucide.createIcons();
    }

    function openSheet(subject) {
      const c = subject.content;
      const isDone = completedLessonNames.includes(subject.name);
      
      document.getElementById('sheetContent').innerHTML = `
        <div class="sheet-date">${c.date}</div>
        <h2 class="sheet-title">${c.title}</h2>
             <div class="sheet-divider"></div>
        ${c.image1 ? `<img src="${c.image1}" class="sheet-image" onclick="openViewer('${c.image1}')">` : ''}
        <p class="sheet-text">${c.text}</p>
      `;

      document.getElementById('sheetActions').innerHTML = `
  <button class="sheet-btn complete-btn" id="markDoneBtn" 
          onclick="markAsComplete('${subject.name}')" ${isDone ? 'disabled' : ''}>
          ${isDone ? 'Completed' : 'Mark as Complete'}
        </button>
        ${c.button1 ? `<a href="${c.button1.link}" class="sheet-btn" target="_blank">${c.button1.text}</a>` : ''}
      
      `;

      document.getElementById('backdrop').classList.add('open');
      document.getElementById('bottomSheet').classList.add('open');
      document.body.style.overflow = 'hidden';
      history.pushState({view: 'sheet'}, "");
      lucide.createIcons();
    }

    function markAsComplete(name) {
      if (!completedLessonNames.includes(name)) {
        completedLessonNames.push(name);
        localStorage.setItem('completedLessonNames', JSON.stringify(completedLessonNames));
        const btn = document.getElementById('markDoneBtn');
        if(btn) { btn.innerText = "Completed"; btn.disabled = true; }
        renderList();
        setTimeout(() => history.back(), 500);
      }
    }

    // --- VIEWER SYSTEM ---
    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewerImg');
    let scale = 1, lastScale = 1, translateX = 0, translateY = 0, startX = 0, startY = 0, prevDiff = -1, lastTap = 0;

    function openViewer(src) {
      viewerImg.src = src;
      viewer.style.display = "flex";
      scale = 1; translateX = 0; translateY = 0;
      updateTransform(false);
      history.pushState({view: 'viewer'}, "");
    }

    function updateTransform(animate = false) {
      viewerImg.style.transition = animate ? "transform 0.3s cubic-bezier(0.2, 0, 0.2, 1)" : "none";
      viewerImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    viewer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
        let now = Date.now();
        if (now - lastTap < 300) {
          scale = (scale > 1.1) ? 1 : 2.5;
          if(scale === 1) { translateX = 0; translateY = 0; }
          updateTransform(true);
          lastTap = 0; return;
        }
        lastTap = now;
      } else if (e.touches.length === 2) {
        prevDiff = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        lastScale = scale;
      }
    });

    viewer.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && scale > 1) {
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        updateTransform(false);
      } else if (e.touches.length === 2) {
        const curDiff = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (prevDiff > 0) scale = Math.min(Math.max(1, lastScale * (curDiff / prevDiff)), 5);
        updateTransform(false);
      }
    }, { passive: false });

    window.onpopstate = () => {
      document.getElementById('backdrop').classList.remove('open');
      document.getElementById('bottomSheet').classList.remove('open');
      viewer.style.display = "none";
      document.body.style.overflow = '';
    };

    renderList();
  </script>
